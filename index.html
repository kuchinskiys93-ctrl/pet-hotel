<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Хвостатый отель</title>
<meta name="theme-color" content="#fdf3e7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Хвост. отель">
<style>
:root{--bg:#fdf3e7;--card:#fff;--ink:#3b2f2a;--muted:#8a7a70;--accent:#ff8a4c;--accent2:#5bb98c;--bad:#e35d5d;--warn:#f2b134;--line:#ecdac6;--track:#f3e6d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
#app{max-width:480px;margin:0 auto;padding:0 12px 96px}
.head{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:8px;box-shadow:0 8px 8px -8px #0000001f}
.head .phone{margin:0}
.qbar{display:flex;align-items:center;gap:8px;margin-top:6px;background:#fff;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.qbar .arr{margin-left:auto;color:var(--muted);font-size:12px}
.qbar.go{box-shadow:0 0 0 3px var(--accent2)}
.qbar.go .arr{color:var(--accent2)}
.qlist{background:#fff;border-radius:0 0 12px 12px;margin-top:-6px;padding:6px 10px 4px;box-shadow:0 2px 0 var(--line)}
.qi{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--track);font-size:13px}
.qi:first-child{border-top:none}
.qi .av{width:30px;height:30px;font-size:30px;line-height:1;flex:none}
.qi .av svg{width:1em;height:1em}
.qi div{flex:1}.qi small{display:block;color:var(--muted);font-size:11px}
.qi button{border:none;border-radius:10px;padding:7px 10px;font-family:inherit;font-weight:800;font-size:12px;background:var(--accent2);color:#fff;cursor:pointer}
.qi button:disabled{background:#e9ddd0;color:var(--muted);cursor:default}
.head .phone.idle{padding-top:8px;padding-bottom:8px}
.head .phone.idle .ring{width:36px;height:36px;font-size:18px}
.top{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.pill{flex:1;background:var(--card);border-radius:14px;padding:6px 8px;font-weight:800;box-shadow:0 2px 0 var(--line);text-align:center;font-size:16px;white-space:nowrap}
.pill small{display:block;font-weight:500;color:var(--muted);font-size:11px}
h3{margin:14px 2px 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.bar{height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent2);border-radius:4px}
.pv{width:1em;height:1em;display:inline-block;vertical-align:-.15em;overflow:visible}
img.pv.photo{border-radius:50%;box-shadow:0 0 0 .05em #fff,0 .04em .1em #0004;object-fit:cover;-webkit-user-drag:none;user-select:none}
.card{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 3px 0 var(--line);position:relative}
/* Телефон */
.phone{display:flex;align-items:center;gap:12px;cursor:pointer}
.phone .ring{font-size:30px;width:52px;height:52px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;flex:none;animation:ring .5s infinite}
.phone.idle{cursor:default;opacity:.75}
.phone.idle .ring{background:#e9ddd0;animation:none;font-size:24px}
.phone b{font-size:15px}
.phone small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.phone .ttl{margin-top:6px;height:5px}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.card.calling{box-shadow:0 0 0 3px var(--accent2),0 3px 0 var(--line);animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #5bb98c55,0 3px 0 var(--line)}}
/* Приёмная */
.lobby{display:flex;gap:8px;flex-wrap:wrap}
.guest{flex:1 1 140px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px;box-shadow:0 3px 0 var(--line);cursor:pointer}
.guest .av{font-size:44px;line-height:1}
.guest b{font-size:14px}.guest small{display:block;color:var(--muted);font-size:11px}
.guest.ready{box-shadow:0 0 0 3px var(--accent),0 3px 0 var(--line)}
.guest.ready .av{animation:hopin 1s infinite}
.guest.coming{cursor:default}
.guest>div:last-child{flex:1;min-width:0}
.guest.busy{box-shadow:0 0 0 3px var(--accent2),0 3px 0 var(--line)}
.guest.busy .av{animation:none}
.gsteps{display:flex;gap:4px;margin-top:5px}
.gsteps span{font-size:13px;width:24px;height:24px;border-radius:8px;background:#f3ebe1;display:flex;align-items:center;justify-content:center;opacity:.55}
.gsteps span.ok{background:#e7f6ee;opacity:1}
.gsteps span.now{background:#fff7ec;box-shadow:0 0 0 2px var(--accent2);opacity:1;animation:pulse 1s infinite}
.guest .bar{height:5px;margin-top:5px}
.guest.coming .av{animation:drive 1.2s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes hopin{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.empty-note{color:var(--muted);font-size:13px;padding:6px 4px}
/* Номера */
.rooms{display:flex;flex-direction:column;gap:12px}
.rcard{background:linear-gradient(#fff 0 62%,#f7ecdd 62%);border-radius:20px;padding:12px;box-shadow:0 3px 0 var(--line);position:relative;overflow:hidden}
.rcard.free{background:repeating-linear-gradient(135deg,#fbf4ea 0 12px,#f7ecdf 12px 24px);color:var(--muted)}
.rcard.add{background:#fbf4ea;border:2px dashed #d4b48f;box-shadow:none;text-align:center;color:var(--muted);cursor:pointer;padding:16px}
.rcard.add b{display:block;font-size:24px;color:var(--accent)}
.rcard.pickup{box-shadow:0 0 0 3px var(--accent),0 3px 0 var(--line)}
.rhead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.tar{background:#fff3e6;color:#b4692e;border-radius:8px;padding:2px 8px;font-weight:800}
.rbody{display:flex;gap:12px;align-items:center;margin-top:6px}
.petbox{position:relative;width:96px;height:96px;flex:none}
.petbox .bed{position:absolute;left:4px;right:4px;bottom:2px;height:30px;border-radius:50%;background:radial-gradient(#ffd9b3,#f0b27a);box-shadow:inset 0 -4px 0 #d98e4f}
.petbox .bowl{position:absolute;right:-6px;bottom:0;font-size:20px}
.petbox .pet{position:absolute;left:14px;bottom:14px;font-size:68px;line-height:1;animation:idle 2.6s ease-in-out infinite;transform-origin:50% 100%}
.petbox .fx{position:absolute;left:0;right:0;top:-6px;text-align:center;font-size:24px;pointer-events:none}
.rinfo{flex:1;min-width:0}
.rinfo .nm{font-weight:800;font-size:16px}
.rinfo .nm small{font-weight:600;color:var(--muted);font-size:12px}
.lbl{font-size:11px;color:var(--muted);margin:6px 0 3px;display:flex;justify-content:space-between}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.svc{flex:1 1 0;min-width:58px;position:relative;border:none;background:#f3ebe1;border-radius:14px;padding:8px 4px 6px;font-family:inherit;font-size:22px;cursor:pointer;color:var(--ink);overflow:hidden}
.svc small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;line-height:1.15}
.svc .cnt{position:absolute;right:5px;top:3px;font-size:10px;font-weight:800;color:var(--muted)}
.svc.req{background:#fff;box-shadow:0 0 0 3px var(--accent);animation:pulse 1s infinite}
.svc.req small{color:var(--accent)}
.svc.doing{background:#e7f6ee;box-shadow:0 0 0 3px var(--accent2)}
.svc.can{background:#4a8fe0;color:#fff;box-shadow:0 3px 0 #2f6db8;animation:pulse 1.2s infinite}
.svc.can small,.svc.can .cnt{color:#fff}
.svc.done{opacity:.45}
.svc.cd{opacity:.6;background:#efe6da}
.svc.cd small{color:var(--muted)}
.svc .prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent2)}
.svc .help{position:absolute;left:4px;top:2px;font-size:11px}
@keyframes pulse{50%{transform:scale(1.05)}}
.pickbtn{width:100%;margin-top:10px;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:12px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;animation:pulse 1.2s infinite}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
/* анимации ухода */
/* ---- Компактные номера: по 2 в ряд ---- */
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rcard{background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column}
.rhead{font-size:11px}
.rhead .tar{padding:1px 6px;font-size:13px}
.rbody{flex-direction:row;gap:6px;margin-top:4px;align-items:center}
.petbox{width:54px;height:52px}
.petbox .bed{height:17px;left:3px;right:3px;bottom:1px}
.petbox .bowl{font-size:12px;right:-5px}
.petbox .pet{font-size:40px;left:7px;bottom:7px}
.petbox .fx{font-size:14px;top:-6px}
.rinfo{flex:1;min-width:0}
.rinfo .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:11px;margin:3px 0 2px;color:var(--ink);font-weight:700}
.rinfo .bar{height:5px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.svc{min-width:0;padding:7px 0 5px;font-size:20px;border-radius:11px;line-height:1.1}
.svc small{display:none}
.svc .cnt{right:3px;top:1px;font-size:9px}
.svc .help{left:2px;top:0;font-size:9px}
.svc.can{animation:pulse 1.2s infinite}
.pickbtn{margin-top:8px;padding:10px 4px;font-size:14px}
.rcard.free .rbody{flex:1;justify-content:center}
.rcard.free .rinfo{text-align:center;font-size:12px}
.rcard.add{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;min-height:120px;font-size:12px}
/* ---- Стабильная раскладка: блоки не меняют высоту, номера не «прыгают» ---- */
.head .phone,.head .phone.idle{height:70px;box-sizing:border-box;padding-top:8px;padding-bottom:8px}
.head .phone>div:last-child{min-width:0}
.head .phone small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .phone .ring{width:44px;height:44px;font-size:22px}
.lobby{flex-wrap:nowrap;overflow-x:auto;height:92px;padding:3px;margin:-3px;scrollbar-width:none}
.lobby::-webkit-scrollbar{display:none}
.guest{flex:0 0 calc(50% - 4px);box-sizing:border-box;height:86px;padding:8px;gap:6px;align-items:center;overflow:hidden}
.guest .av{font-size:34px;flex:none}
.guest small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guest b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.guest .gsteps span{width:22px;height:20px;font-size:11px}
.empty-note{height:86px;box-sizing:border-box;display:flex;align-items:center}
.acts{min-height:var(--acts-h,78px);align-content:start}
.pickbtn{height:var(--acts-h,78px);box-sizing:border-box}
.ttbox{height:var(--acts-h,78px);margin-top:8px;box-sizing:border-box;border-radius:11px;background:#fff7ec;box-shadow:inset 0 0 0 2px #ffd9b8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 10px;text-align:center}
.ttbox b{font-size:13px;color:#b4692e}
.ttbox span{font-size:12px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttbox .bar{width:100%;height:6px;margin-top:3px}
.ttbox .bar i{background:var(--accent)}
/* заселение — зелёное, выселение — розовое: сразу видно, что происходит */
.ttbox.tin{background:#eaf8ef;box-shadow:inset 0 0 0 2px #b9e5c8}
.ttbox.tin b{color:#2f8a5b}.ttbox.tin .bar i{background:#4fbf82}
.ttbox.tout{background:#fdecf1;box-shadow:inset 0 0 0 2px #f6c3d2}
.ttbox.tout b{color:#c0476f}.ttbox.tout .bar i{background:#ec7fa0}
.rooms{grid-auto-rows:1fr}
.rcard{min-height:192px;box-sizing:border-box}
.a-clean .pet{animation:wiggle .4s infinite}
.a-brush .pet{animation:idle .8s infinite}
.a-wheel .pet{animation:hop .35s infinite}
.a-talk .pet{animation:chomp .5s infinite}
/* ---- Отели и престиж ---- */
.htabs{display:flex;gap:6px;padding-top:calc(8px + env(safe-area-inset-top));align-items:center}
.htabs button{flex:1;min-width:0;border:none;border-radius:10px;padding:6px 8px;font-family:inherit;font-weight:800;font-size:12px;background:#f3ebe1;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htabs button.on{background:var(--accent);color:#fff}
.htabs .stars{font-weight:900;font-size:13px;color:#e0a100;white-space:nowrap}
.htabs+.top{padding-top:6px}
.prest{background:linear-gradient(135deg,#fff6dc,#ffe9b8);border-radius:14px;padding:10px 12px;margin-top:8px;box-shadow:0 2px 0 #f0d58a}
.prest b{font-size:15px}.prest small{display:block;color:#8a6a2a;font-size:12px;margin-top:3px;line-height:1.35}
.prest .need{color:var(--muted)}
.prest .ok{color:var(--accent2)}
.prest button{margin-top:8px;width:100%}
/* ---- Уровни номеров: Стандарт — белый · Комфорт — золотой · Люкс — бордо с золотом ---- */
.rhead .lvn{font-weight:900;margin-left:3px}
.rcard.lv1 .rhead .lvn{color:#9a8a7e}
.rcard.lv2{background:linear-gradient(160deg,#fff8d9,#ffe08a)}
.rcard.lv2:not(.pickup){box-shadow:inset 0 0 0 2px #d4a017,0 3px 0 #e6c45a}
.rcard.lv2 .rhead .lvn{color:#a87b05}
.rcard.free.lv2{background:repeating-linear-gradient(135deg,#fff6d1 0 12px,#ffe9a6 12px 24px)}
.rcard.lv2 .petbox::before{content:'';position:absolute;left:1px;right:1px;bottom:12px;height:30px;border-radius:15px;background:#fffaf0;box-shadow:inset 0 0 0 1.5px #ecd28a,0 1px 0 #e0c071}
.rcard.lv2 .petbox .bed{left:-3px;right:-3px;bottom:0;height:21px;border-radius:50%/60%;background:linear-gradient(#ffe9a3,#e8b93a);box-shadow:inset 0 4px 0 #fff8,0 2px 0 #c9971e}
.rcard.lv3{background:linear-gradient(160deg,#7a1f3d,#561228);color:#fdeef2}
.rcard.lv3:not(.pickup){box-shadow:inset 0 0 0 2px #e2b84a,inset 0 0 0 3.5px #8f3352,0 3px 0 #3d0c1c}
.rcard.lv3 .rhead,.rcard.lv3 .rinfo .nm,.rcard.lv3 .lbl,.rcard.lv3 .rinfo{color:#fdeef2}
.rcard.lv3 .rhead .lvn{color:#f0c443}
.rcard.lv3 .rinfo .bar{background:#ffffff26}
.rcard.lv3 .svc:not(.can):not(.doing){background:#ffffff1f;color:#fff}
.rcard.lv3 .svc .cnt{color:#fdeef2}
.rcard.free.lv3{background:repeating-linear-gradient(135deg,#6e1c37 0 12px,#5c1630 12px 24px);color:#fdeef2}
.rcard.lv3 .petbox::before{content:none}
/* Готовые процедуры: не бледные, а на светлой плашке с зелёной галочкой */
.svc.done{opacity:1}
.svc.done .cnt{display:none}
.svc.done::after{content:'✓';position:absolute;right:2px;bottom:2px;width:14px;height:14px;border-radius:50%;background:#3fae7a;color:#fff;font-size:10px;font-weight:900;line-height:14px;text-align:center}
.rcard.lv2 .svc.done{background:#ffffff59}
.rcard.lv3 .svc.done{background:#ffffff38}
/* Детали на фоне номеров: узор «обоев» и предмет интерьера в углу */
.rcard.lv1:not(.free){background-image:radial-gradient(#ecdfcf 1.1px,transparent 1.5px);background-size:12px 12px}
.rcard.lv2:not(.free){background:radial-gradient(circle,#ffffffa6 1.3px,transparent 1.8px) 0 0/14px 14px,linear-gradient(160deg,#fff8d9,#ffe08a)}
.rcard.lv3:not(.free){background:radial-gradient(circle,#e2b84a40 1.6px,transparent 2.1px) 0 0/16px 16px,radial-gradient(circle,#e2b84a26 1.2px,transparent 1.7px) 8px 8px/16px 16px,linear-gradient(160deg,#7a1f3d,#561228)}
.rcard.lv1::before,.rcard.lv2::before,.rcard.lv3::before{position:absolute;top:3px;right:6px;font-size:16px;line-height:1;pointer-events:none}
.rcard.lv1::before{content:'🪴';opacity:.55}
.rcard.lv2::before{content:'🖼️';opacity:.8}
.rcard.lv3::before{content:'👑';opacity:.9;filter:drop-shadow(0 0 3px #f0c44399)}
.rcard.lv1::after,.rcard.lv2::after,.rcard.lv3::after{position:absolute;bottom:6px;right:8px;font-size:17px;line-height:1;pointer-events:none}
.rcard.lv1::after{content:'🧶';opacity:.45}
.rcard.lv2::after{content:'🛋️';opacity:.7}
.rcard.lv3::after{content:none}
.rcard.add::before{content:none}
/* Люкс: квадратная бордовая подушка с золотым кантом и кисточками на уголках */
.rcard.lv3 .petbox .bed{left:4px;right:4px;bottom:3px;height:30px;border-radius:7px;background:linear-gradient(150deg,#b9466b,#7d1f40);box-shadow:inset 0 0 0 1.5px #e2b84a,inset 0 3px 0 #ffffff30,0 2px 0 #3d0c1c}
.rcard.lv3 .petbox::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:38px;pointer-events:none;z-index:2;
  background:radial-gradient(circle at 4px 4px,#f0c443 2.6px,#c99a26 3px,transparent 3.4px),radial-gradient(circle at calc(100% - 4px) 4px,#f0c443 2.6px,#c99a26 3px,transparent 3.4px),
  radial-gradient(circle at 4px calc(100% - 4px),#f0c443 2.6px,#c99a26 3px,transparent 3.4px),radial-gradient(circle at calc(100% - 4px) calc(100% - 4px),#f0c443 2.6px,#c99a26 3px,transparent 3.4px)}
.a-food .pet{animation:chomp .35s infinite}
@keyframes chomp{50%{transform:translateY(4px) scale(1.04,.94)}}
.a-wash .pet{animation:wiggle .4s infinite}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.a-groom .pet{animation:idle .8s infinite}
.a-walk .pet{animation:hop .35s infinite}
@keyframes hop{50%{transform:translateY(-12px) rotate(-4deg)}}
.a-play .pet{animation:spin 1s infinite}
@keyframes spin{0%{transform:rotate(0)}25%{transform:rotate(-12deg) translateY(-8px)}50%{transform:rotate(0) translateY(0)}75%{transform:rotate(12deg) translateY(-8px)}}
.fx span{display:inline-block;animation:floatup 1.2s ease-in infinite;opacity:0}
.fx span:nth-child(2){animation-delay:.4s}.fx span:nth-child(3){animation-delay:.8s}
@keyframes floatup{0%{transform:translateY(20px);opacity:0}30%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
/* Низ, листы */
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center;z-index:6}
.bigbtn{max-width:456px;width:100%;background:var(--ink);color:#fff;border:none;border-radius:16px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.bigbtn.green{background:var(--accent2)}.bigbtn.ghost{background:#e9ddd0;color:var(--ink)}
.bigbtn:disabled{background:#cbbfb4}
#back{position:fixed;inset:0;background:#0006;z-index:20;display:none;touch-action:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:none;justify-content:center}
#sheet .in{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin-bottom:4px}
.sh-sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.sh-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 2px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-top:8px;box-shadow:0 2px 0 var(--line)}
/* ---- Магазин: вкладки и карточки с уровнями ---- */
.stabs{display:flex;gap:4px;background:#f0e4d6;border-radius:12px;padding:3px;margin:6px 0 4px;position:sticky;top:-16px;z-index:2}
.stabs button{flex:1 1 auto;min-width:0;white-space:nowrap;border:none;background:none;border-radius:9px;padding:8px 3px;font-family:inherit;font-weight:800;font-size:11px;letter-spacing:-.01em;color:var(--muted);cursor:pointer;position:relative}
.stabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.stabs button .dot{position:absolute;top:3px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent2)}
.scard{background:var(--card);border-radius:16px;padding:10px 12px;margin-top:8px;box-shadow:0 2px 0 var(--line)}
.scard .sh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.scard .sh .ic{font-size:24px}
.scard .sh .tag{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent2);background:#e7f6ee;border-radius:8px;padding:2px 7px;white-space:nowrap}
.scard .lock{font-size:12px;color:var(--muted);margin-top:4px}
.up{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--track)}
.scard .sh+.up{border-top:none;padding-top:2px}
.up .ul{flex:1;min-width:0}
.up .ul b{font-size:13px;display:flex;align-items:center;gap:6px}
.up .ul b em{font-style:normal;font-size:11px;color:var(--muted);font-weight:800}
.up .ul small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{flex:1;max-width:22px;height:6px;border-radius:3px;background:#efe3d4}
.pips i.on{background:var(--accent2)}
.pips.lots i{max-width:12px}
.ubtn{border:none;border-radius:12px;min-width:84px;padding:7px 8px;font-family:inherit;cursor:pointer;background:var(--accent2);color:#fff;line-height:1.15;text-align:center}
.ubtn b{display:block;font-size:11px;font-weight:800;opacity:.9}
.ubtn span{display:block;font-size:14px;font-weight:900}
.ubtn:disabled{background:#cbbfb4;cursor:default}
.ubtn.max{background:transparent;color:var(--accent2);box-shadow:inset 0 0 0 2px #bfe5cf}
.ubtn.max span{font-size:13px}
.row .ic{font-size:26px}
.row div{flex:1}
.row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.buy{background:var(--accent2);color:#fff;border:none;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;min-width:92px;cursor:pointer;font-family:inherit}
.buy:disabled{background:#cbbfb4}
.buy.done{background:transparent;color:var(--accent2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stats div{background:var(--card);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:16px}
.link{background:none;border:none;color:var(--bad);margin-top:16px;font-size:13px;cursor:pointer;font-family:inherit}
/* Звонок и знакомство */
.bigpet{font-size:110px;text-align:center;line-height:1;margin:6px 0;animation:idle 2.4s ease-in-out infinite}
.bigpet.react{animation:hopin .5s 2}
.bubble{background:#fff;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.35;box-shadow:0 2px 0 var(--line);margin:4px 0 12px}
.choices{display:flex;gap:8px}
.choices button{flex:1}
.acts3{display:flex;gap:8px;margin:6px 0 4px}
.acts3 button{flex:1;border:none;background:#fff;border-radius:14px;padding:10px 4px;font-size:24px;font-family:inherit;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.acts3 button small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.acts3 button{position:relative;overflow:hidden}
.acts3 button.did{background:#e7f6ee}
.acts3 button.doing{background:#fff7ec;box-shadow:0 0 0 3px var(--accent2)}
.acts3 .prog{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--accent2)}
.meet-mood{text-align:center;font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 4px}
.meet-mood b{color:var(--accent2)}
.react-txt{text-align:center;font-weight:700;min-height:22px;color:#b4692e;margin:6px 0}
.tarif{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px;font-family:inherit;cursor:pointer;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.tarif .ic{font-size:26px}
.tarif div{flex:1}
.tarif b{font-size:15px}.tarif small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tarif .pr{font-weight:900;color:var(--accent2);font-size:14px;white-space:nowrap}
.needs{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 2px 0 var(--line)}
.needs .nd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:3px 0}
.needs .nd span{font-size:18px}
.needs .nd.off{color:var(--muted);font-weight:600}
.needs .hint{font-size:12px;color:var(--muted);padding:3px 0}
.tarif:disabled{opacity:.5;cursor:default}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.fl{position:absolute;font-weight:900;font-size:18px;transform:translate(-50%,-50%);animation:fl 1.1s ease-out forwards;text-shadow:0 1px 0 #fff;white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-160%);opacity:0}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:25;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
/* ---- Тема «Премиум» для «Пушистого дворика»: лаванда и золото ---- */
body.k-rodents{--bg:#f1eafc;--card:#fffdf8;--ink:#3a2c55;--muted:#7d6f96;--line:#e3d6f5;--track:#ece3fa;--accent:#9b6fe0;background:var(--bg);color:var(--ink)}
body.k-rodents .pill,body.k-rodents .card,body.k-rodents .qbar{box-shadow:0 0 0 1.5px #e2b84a,0 2px 0 var(--line)}

body.k-rodents .rcard.free.lv1{background:repeating-linear-gradient(135deg,#fbf8ff 0 12px,#f3ecfd 12px 24px)}
body.k-rodents .svc.can{background:#8a63d8;box-shadow:0 3px 0 #6b47b8}
body.k-rodents .phone .ring{background:radial-gradient(circle at 35% 30%,#ffe9a8,#e0a92e 70%,#b8831a);box-shadow:0 0 0 3px #fff3cf}
body.k-rodents .phone.idle .ring{background:radial-gradient(circle at 35% 30%,#fff4d2,#ecc76a 75%,#c99a2e);opacity:.9}

body.k-rodents .ubtn.max{color:#8a63d8;box-shadow:inset 0 0 0 2px #d7c6f5}
body.k-rodents .pips i.on{background:#9b6fe0}

body.k-rodents .stabs{background:#e6dcf7}
.guest .av.ride{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:34px;animation:drive 1.2s ease-in-out infinite}
.guest .av.ride .rider{font-size:19px;line-height:1;margin-bottom:-5px;position:relative;z-index:1}
.guest .av.ride .car{position:static;font-size:24px;line-height:1;animation:none}
.guest .av.ride .car svg{width:64px;height:auto;display:block}

.lobby{height:100px}
.guest{flex:0 0 calc(25% - 6px);height:94px;flex-direction:column;justify-content:flex-start;gap:2px;padding:6px 3px;text-align:center;border-radius:14px}
.guest>div:last-child{width:100%;flex:none}
.guest .av{font-size:32px;position:relative;line-height:1}
.guest .av .car{position:absolute;right:-10px;bottom:-4px;font-size:15px;animation:drive 1.2s ease-in-out infinite}
.guest.coming .av{animation:none}
.guest b{font-size:11.5px}
.guest small{font-size:10px}
.guest .gsteps{justify-content:center;gap:2px;margin-top:2px}
.guest .gsteps span{width:18px;height:16px;font-size:9px;border-radius:5px}
.guest .bar{height:4px;margin-top:4px}
.lobby .empty-note{flex:1}
/* ---- Уровни номеров: Стандарт / Комфорт / Люкс ---- */
.petbox .pet{font-size:36px;left:9px;bottom:12px;z-index:1}
.petbox .bowl{z-index:2}
/* Стандарт: жёсткая подложка-коврик */
.rcard .petbox .bed{left:0;right:0;bottom:1px;height:15px;border-radius:5px;background:linear-gradient(#e2c6a2,#cfa77a);box-shadow:inset 0 -3px 0 #b88b5a,0 1px 0 #0001}
/* Комфорт: мягкая пастельная лежанка и подушка за спиной */
/* Люкс: фиолетовая подушка с золотой окантовкой и кисточками */
/* Люкс: квадратная подушка с золотым кантом и кисточками на уголках */
/* ---- Заставка ---- */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 35%,#ffe3c4,#ffb98a 55%,#f08a5d);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:opacity .5s;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
#intro.out{opacity:0;pointer-events:none}
#intro .paws{position:absolute;inset:0;pointer-events:none}
#intro .paws span{position:absolute;font-size:22px;opacity:.18;animation:pawup 9s linear infinite}
@keyframes pawup{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(40deg)}}
#intro .logo{font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 #c9622f,0 6px 14px #0003;text-align:center;line-height:1.05;letter-spacing:.01em;animation:logoin .8s ease-out both}
#intro .logo small{display:block;font-size:14px;font-weight:700;margin-top:6px;text-shadow:0 1px 0 #c9622f;opacity:.95}
@keyframes logoin{from{transform:translateY(-30px) scale(.8);opacity:0}}
#intro .stage{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:22px 0 8px}
#intro .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s}
#intro .slide.on{opacity:1}
#intro .disc{position:absolute;inset:8%;border-radius:50%;background:#fff8ef;box-shadow:0 10px 0 #e0875a,0 18px 30px #0003;overflow:hidden}
#intro .slide.on .disc .hero{animation:kb 2s ease-out both}
#intro .hero{position:absolute;left:50%;top:54%;font-size:min(42vw,160px);line-height:1;transform:translate(-50%,-50%)}
#intro .hero.two{display:flex;gap:2px;font-size:min(30vw,112px)}
@keyframes kb{from{transform:translate(-50%,-44%) scale(.86)}to{transform:translate(-50%,-50%) scale(1.04)}}
#intro .prop{position:absolute;font-size:min(11vw,42px);animation:bob 1.6s ease-in-out infinite}
#intro .cap{position:absolute;left:0;right:0;bottom:-6px;text-align:center}
#intro .cap span{display:inline-block;background:#fff;color:#b4562a;font-weight:900;font-size:15px;padding:7px 14px;border-radius:999px;box-shadow:0 3px 0 #e0875a}
#intro .dots{display:flex;gap:6px;margin-top:14px}
#intro .dots i{width:7px;height:7px;border-radius:50%;background:#fff8;transition:all .3s}
#intro .dots i.on{background:#fff;width:18px;border-radius:4px}
#intro .tap{margin-top:28px;color:#fff;font-weight:900;font-size:18px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 0 #c9622f;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35;transform:scale(.96)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
#intro .ver{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));color:#fff;opacity:.7;font-size:11px;font-weight:700}
</style>

// Фото-мордочки котов и шпицев: у каждого гостя своя (выбирается при звонке)
const PHOTOS={cat:['cat1','cat2','cat3'],dog:['dog1','dog2','dog3']};
const photoImg=n=>`<img class="pv photo" src="pets/${n}.png" alt="" draggable="false">`;
function face(g){
  const L=PHOTOS[g.type];if(!L)return PET[g.type].svg;
  let i=g.look;if(i==null){i=0;for(const ch of g.name||'')i+=ch.charCodeAt(0)} // у старых гостей — по кличке
  return photoImg(L[i%L.length]);
}

function roomReqMissing(lvl){
  const m=[];if(lvl<2)return m;
  const need=lvl===2?2:3;
  if(lvl===2)for(const [k,e] of Object.entries(EQ))if(!S.eq[k])m.push(e.icon+' '+e.name.toLowerCase());
  for(const k of Object.keys(SVC))if((S.help[k]||0)<need)m.push(`🧑 «${SVC[k].name.toLowerCase()}» ур. ${need}`);
  const sp=ROOM_SPEED_REQ[lvl];for(const k of Object.keys(SVC))if((S.lvl[k]||0)<sp)m.push(`⚡ скорость «${SVC[k].name.toLowerCase()}» ур. ${sp}`);
  if(lvl===3&&(S.staff.desk||0)<3)m.push('🛎️ ресепшен ур. 3');
  return m;
} const MAX_ROOMS=8, MAX_LVL=10;

function attach(H){ // монеты у отелей общие — S.money читает и пишет общий кошелёк
  Object.defineProperty(H,'money',{get(){return G.money},set(v){G.money=v},enumerable:false,configurable:true});
  return H;
}
function fixHotel(H){ // подтягиваем старые сохранения к нынешнему виду
  H.kind=H.kind||'cats';
  if(!H.queue)H.queue=[];
  for(const k in H.help)if(typeof H.help[k]==='boolean')H.help[k]=H.help[k]?1:0;
  if(!H.staff)H.staff={phone:false,desk:0,out:false};
  if(typeof H.staff.desk==='boolean')H.staff.desk=H.staff.desk?1:0;
  if(H.ads==null)H.ads=0;
  if(!H.roomLvl)H.roomLvl=[];
  if(H.manager==null)H.manager=false;if(H.prestiged==null)H.prestiged=false;
  for(const p of H.pets){p.cd=p.cd||{};if(!p.acts)p.acts=p.act?[p.act]:[];delete p.act}
  return attach(H);
}

const PRICE_PER_LVL=0.05, PRICE_PER_HELP=0.10;
const priceMult=(k,lvl=S.lvl[k]||0,help=S.help[k]||0)=>1+PRICE_PER_LVL*lvl+PRICE_PER_HELP*help;

function plan(p){
  const extra=knownNeeds(p);
  const food=extra.length>=3?3:2;
  const list=[...Array(food).fill('food'),...extra];
  const tk=extra.some(k=>K.fun.includes(k))?'play':extra.length?'care':'hotel';
  return {list,tk,stay:60+15*extra.length,price:list.reduce((a,k)=>a+svcPrice(k),0)};
}
function checkIn(id,auto){ // заселяем с комплексом по выявленным нуждам
  const p=pet(id);if(!p||p.state!=='arrived')return;
  const r=freeRoom();if(r<0){if(!auto)toast('Все номера заняты — подождите, пока кто-то уедет 🙂');return}
  const P=plan(p),tk=P.tk;
  const list=P.list;
  p.price=P.price;p.hidden=hiddenNeeds(p);
  const total=P.stay*rnd(0.9,1.1)*stayMult(r); // в Комфорте и Люксе гости уезжают быстрее
  p.reqs=list.map(svc=>({svc,done:false,miss:false}));p.cd={};p.acts=[];list.forEach(k=>p.cd[k]=S.t); // cd[k] — с какого момента процедура доступна
  Object.assign(p,{state:'checkin',tt:{left:CHECK_T,total:CHECK_T},room:r,tariff:tk,stay:total,total,mood:meetMood(p)});p.meetAct=null; // сначала оформляем заселение в номере
  if(sheet&&sheet.type==='meet'&&sheet.k===id)closeSheet();
  toast((auto?'🛎️ Администратор: ':'')+`🏨 ${p.name} заселился в номер ${r+1}`);
  if(!BG)setTimeout(()=>toastOnce('care','👀 Выбирайте сами, что делать: каждая процедура поднимает настроение'),2900);
}

const helperBusy=svc=>helperLoad(svc)>=(S.help[svc]||0); // уровень помощника = сколько гостей он ведёт одновременно
const HELP_MAX=5, helpCost=k=>Math.round(HELP[k]*Math.pow(1.6,S.help[k]||0));
const activeReq=(p,svc)=>p.reqs.find(r=>!r.done&&!r.miss&&(!svc||r.svc===svc));
function doService(id,svc,byHelper){
  const p=pet(id);if(!p||p.state!=='room')return;
  if(p.acts.length){if(!byHelper)floatAt('room-'+p.room,'Сначала закончим эту процедуру 🙂','#8a7a70');return} // с гостем — одна процедура за раз
  if(byHelper&&helperBusy(svc))return;
  if(!byHelper&&S.help[svc]&&!helperBusy(svc)){floatAt('room-'+p.room,'Это сделает помощник 🧑','#8a7a70');return}
  const r=activeReq(p,svc);
  if(!r){if(!byHelper)floatAt('room-'+p.room,'Уже сделано ✅','#8a7a70');return}
  if(onCd(p,svc)){if(!byHelper)floatAt('room-'+p.room,`${p.name} отдыхает, позже 🙂`,'#8a7a70');return}
  const t=svcTime(svc);p.acts.push({svc,left:t,total:t,help:!!byHelper});
}
// Доход за последние 10 игровых минут — по нему считается офлайн-доход
const RATE_WIN=600, OFF_SHARE=0.5, OFF_MAX_H=8, MGR_LVL=3;
function logIncome(H,amt){H.log=(H.log||[]).filter(e=>e[0]>H.t-RATE_WIN);H.log.push([Math.round(H.t),amt])}
// Доход всех отелей за последнюю игровую минуту — показываем в шапке под монетами
const lastMinute=()=>G.hotels.reduce((a,H)=>a+(H.log||[]).filter(e=>e[0]>H.t-60).reduce((b,e)=>b+e[1],0),0);
function incomeRate(H){ // монет в секунду
  const L=(H.log||[]).filter(e=>e[0]>H.t-RATE_WIN);
  return L.reduce((a,e)=>a+e[1],0)/Math.min(RATE_WIN,Math.max(120,H.t));
}
const CHECK_T=2.5; // сколько секунд идёт оформление заселения и выселения
function pickup(id){ // начинаем выселение: подпись и полоска в номере, потом оплата
  const p=pet(id);if(!p||p.state!=='pickup')return;
  p.state='checkout';p.tt={left:CHECK_T,total:CHECK_T};
}
function finishPickup(p){
  const T=TAR[p.tariff],price=p.price||T.price;
  const stars=p.mood>=85?5:p.mood>=65?4:p.mood>=45?3:p.mood>=25?2:1;
  let amt=price*(0.5+p.mood/100*0.7);if(stars===5)amt*=1.2;
  amt*=1+STAR_BONUS*G.stars;
  amt=Math.max(1,Math.round(amt));
  S.money+=amt;S.earned+=amt;S.served++;logIncome(S,amt);S.reviews.push(stars);if(S.reviews.length>20)S.reviews.shift();
  floatAt('room-'+p.room,'+'+amt+' 💰','#2f9a68');floatAt('room-'+p.room,'⭐'.repeat(stars),'#e0a100',22);
  const hid=(p.hidden||[]).map(k=>NEED[k][p.type].toLowerCase());
  toast(hid.length?`😕 Хозяин заметил: ${hid.join(', ')}`:stars>=5?`💖 Хозяин ${p.name} в восторге!`:stars>=4?'😊 Хозяин доволен':'😕 Хозяин ожидал большего');
  S.pets=S.pets.filter(x=>x!==p);
}
function tick(dt){
  S.t+=dt;
  // звонки
  if(S.call){S.call.ttl-=dt;if(S.call.ttl<=0){S.call=null;S.missed++;S.nextCall=callGap();if(sheet&&sheet.type==='call')closeSheet();toast('📞 Пропущенный звонок')}}
  else{S.nextCall-=dt;if(S.nextCall<=0){S.call={pet:newGuest(),ttl:25,max:25};if(!S.staff.phone)toastOnce('call','📞 Звонят! Тапни по телефону, чтобы ответить')}}
  if(S.call&&S.staff.phone&&S.call.max-S.call.ttl>=3)answer(false,true);
  for(const q of [...S.queue])if(S.t>=q.exp){S.queue=S.queue.filter(x=>x!==q);S.missed++;toast(`📋 ${q.pet.name} не дождался и нашёл другой отель`)}
  // администратор сам перезванивает первому в очереди, когда есть свободный номер
  while(S.staff.phone&&S.queue.length&&freeSlots()>0)callBack(S.queue[0].id,true);
  for(const p of [...S.pets]){
    if(p.state==='coming'){p.eta-=dt;if(p.eta<=0){p.state='arrived';p.since=S.t;if(!S.staff.desk)toastOnce('arrive',`🐾 ${p.name} приехал — тапни, чтобы познакомиться`)}}
    else if(p.state==='arrived'){
      const open=sheet&&sheet.type==='meet'&&sheet.k===p.id;
      if(p.meetAct){p.meetAct.left-=dt;if(p.meetAct.left<=0){
        const k=p.meetAct.k;p.meetAct=null;if(!p.did.includes(k))p.did.push(k);
        p.react=pick(PET[p.type].react[k]);
        if(k==='check'){const f=(p.needs||[]).map(x=>NEED[x][p.type].toLowerCase());if(f.length)p.react='Осмотр: '+f.join(', ')+' 📝'}
        if(open){renderSheet();const bp=$('bigpet');if(bp){bp.classList.add('react');setTimeout(()=>bp.classList.remove('react'),1000)}floatAt('bigpet',MEET[k].fx,'#e05a8a')}
      }}
      else if(S.staff.desk&&!open&&(p.adm||deskBusy()<S.staff.desk)){ // администратор сам знакомится, потом заселяет
        p.adm=true;
        const next=Object.keys(MEET).find(k=>!p.did.includes(k));
        if(next)startMeet(p,next);
        else checkIn(p.id,true);
      }
    }
    else if(p.state==='room'){
      for(const a of [...p.acts]){a.left-=dt;if(a.left<=0){const r=activeReq(p,a.svc);if(r){r.done=true;p.mood=Math.min(100,p.mood+(100-MOOD0)/p.reqs.length)}p.cd[a.svc]=S.t+REPEAT_CD;p.acts=p.acts.filter(x=>x!==a)}}
      p.stay-=dt;
      const left=p.reqs.filter(r=>!r.done&&!r.miss);
      if(left.length&&!p.acts.length)p.mood=Math.max(0,p.mood-0.15*dt); // без внимания понемногу скучает
      // свободный помощник сразу берётся за свою процедуру
      for(const r of left)if(S.help[r.svc]&&!onCd(p,r.svc)&&!p.acts.some(a=>a.svc===r.svc)&&!helperBusy(r.svc)){doService(p.id,r.svc,true);toastOnce('helper','🧑 Помощник сам взялся за дело!')}
      if(p.stay<=0&&!p.acts.length){
        for(const r of p.reqs)if(!r.done){r.miss=true;p.mood=Math.max(0,p.mood-15)}
        p.mood=Math.max(0,p.mood-15*(p.hidden||[]).length); // не заметили нужду на осмотре
        p.state='pickup';p.since=S.t;if(!S.staff.out)toastOnce('pick',`🚗 За ${p.name} приехали — нажми «Отдать хозяину»`);
      }
    } else if(p.state==='pickup'){p.mood=Math.max(0,p.mood-0.4*dt);if(S.staff.out)pickup(p.id)} // сотрудник выдачи сразу начинает выселение
    else if(p.state==='checkin'||p.state==='checkout'){
      p.tt.left-=dt;
      if(p.tt.left<=0){if(p.state==='checkin'){p.state='room';p.tt=null}else finishPickup(p)}
    }
  }
}

function buy(what,k){
  let c=0,ok=false;
  if(what==='eq'){if(S.eq[k])return;c=EQ[k].cost;if(S.money>=c){S.eq[k]=true;ok=true;toast(`${EQ[k].icon} Куплено: ${EQ[k].name}`);const sv=Object.keys(SVC).find(x=>SVC[x].eq===k);if(sv)setTimeout(()=>toast(`🎉 Теперь гостям можно: ${SVC[sv].name.toLowerCase()}`),1400)}}
  if(what==='room'){if(S.rooms>=MAX_ROOMS)return;c=ROOM_COST[S.rooms];if(S.money>=c){S.rooms++;ok=true;toast('🛏️ Новый номер готов!')}}
  if(what==='lvl'){if(S.lvl[k]>=MAX_LVL)return;c=lvlCost(k);if(S.money>=c){S.lvl[k]++;ok=true}}
  if(what==='help'){const l=S.help[k]||0;if(l>=HELP_MAX)return;c=helpCost(k);if(S.money>=c){S.help[k]=l+1;ok=true;toast(l?`🧑 Помощник «${SVC[k].name.toLowerCase()}» ур. ${l+1}: одновременно ${l+1} гостя`:`🧑 Помощник: «${SVC[k].name}» теперь сам`)}}
  if(what==='roomup'){const i=+k;if(i>=S.rooms||roomLvl(i)>=ROOM_LVL_MAX||roomReqMissing(roomLvl(i)+1).length)return;c=roomUpCost(i);if(S.money>=c){if(!S.roomLvl)S.roomLvl=[];S.roomLvl[i]=roomLvl(i)+1;ok=true;toast(`${S.roomLvl[i]===3?'💜':'🛏️'} Номер ${i+1} теперь «${ROOM_NAMES[S.roomLvl[i]]}»`)}}
  if(what==='ads'){if((S.ads||0)>=ADS_MAX)return;c=adsCost();if(S.money>=c){S.ads=(S.ads||0)+1;ok=true;S.nextCall=Math.min(S.nextCall,callGap());toast(`📣 Реклама ур. ${S.ads}: звонят в среднем раз в ${Math.round(avgGap())} с`)}}
  if(what==='manager'){if(S.manager||prestigeMissing().length)return;c=K.manager;if(S.money>=c){S.manager=true;ok=true;toast('👔 Управляющий нанят! Теперь можно открыть новый отель')}}
  if(what==='staff'&&k==='desk'){const l=S.staff.desk||0;if(l>=DESK_MAX)return;c=DESK_COST[l];if(S.money>=c){S.staff.desk=l+1;ok=true;toast(l?`🛎️ Администратор ур. ${l+1}: одновременно ${l+1} гостя`:'🛎️ В команде: администратор на ресепшене')}}
  else if(what==='staff'){if(S.staff[k])return;c=STAFF[k].cost;if(S.money>=c){S.staff[k]=true;ok=true;toast(`${STAFF[k].icon} В команде: ${STAFF[k].name.toLowerCase()}`)}}
  if(ok){S.money-=c;save();dirty=true}
}

// Аккуратное обновление DOM: меняем только то, что действительно изменилось.
// Элементы остаются на месте — анимации не перезапускаются и экран не «дёргается».
function morph(to,html){
  const tpl=document.createElement('div');tpl.innerHTML=html;
  morphChildren(to,tpl);
}
function morphChildren(a,b){
  const an=a.childNodes,bn=[...b.childNodes];
  for(let i=0;i<bn.length;i++){
    const x=an[i],y=bn[i];
    if(!x){a.appendChild(y);continue}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y,x);continue}
    if(x.nodeType===3||x.nodeType===8){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
    morphEl(x,y);
  }
  while(an.length>bn.length)a.removeChild(a.lastChild);
}
function morphEl(x,y){
  const live=x.hasAttribute('data-w'); // ширину/цвет полосок ставит update() — не трогаем
  for(const at of [...x.attributes])if(!y.hasAttribute(at.name)&&!(live&&at.name==='style'))x.removeAttribute(at.name);
  for(const at of y.attributes){if(live&&at.name==='style')continue;if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value)}
  if('disabled' in x&&x.disabled!==y.disabled)x.disabled=y.disabled;
  if(x.hasAttribute('data-x')&&x.textContent)return; // цифры ставит update()
  morphChildren(x,y);
}

function update(){ // каждый кадр: только цифры и полоски
  for(const el of document.querySelectorAll('#app [data-w],#sheet [data-w]')){
    const [k,id,x]=el.dataset.w.split(':');let w=0;
    if(k==='ttl')w=S.call?S.call.ttl/S.call.max*100:0;
    else{const p=pet(+id);if(!p)continue;
      if(k==='mood'){w=p.mood;el.style.background=p.mood>60?'var(--accent2)':p.mood>30?'var(--warn)':'var(--bad)'}
      else if(k==='stay')w=p.state==='pickup'||p.state==='checkout'?100:(1-p.stay/p.total)*100;
      else if(k==='tt')w=p.tt?(1-p.tt.left/p.tt.total)*100:100;
      else if(k==='act'){const a=p.acts.find(a=>a.svc===x);w=a?(1-a.left/a.total)*100:0}
      else if(k==='meet')w=p.meetAct?(1-p.meetAct.left/p.meetAct.total)*100:100;}
    el.style.width=Math.max(0,Math.min(100,w)).toFixed(1)+'%';
  }
  for(const el of document.querySelectorAll('#app [data-x]')){
    const [k,id]=el.dataset.x.split(':');let t='';
    if(k==='money')t=fmt(S.money);
    else if(k==='perMin'){const m=lastMinute();t=m>0?`+${fmt(m)} за мин`:'монеты'}else if(k==='rating')t=rating().toFixed(1);
    else if(k==='qexp'){const q=S.queue.find(x=>x.id===+id);if(!q)continue;const r=Math.max(0,Math.ceil(q.exp-S.t));t=r>=60?Math.floor(r/60)+' мин '+(r%60)+' с':r+' с'}
    else{const p=pet(+id);if(!p)continue;
      if(k==='eta')t=Math.max(1,Math.ceil(p.eta));
      else if(k==='mood')t=Math.round(p.mood)+'%';
      else if(k==='left')t=p.state==='pickup'||p.state==='checkout'?'сейчас':Math.max(0,Math.ceil(p.stay))+' с';}
    if(el.textContent!==String(t))el.textContent=t;
  }
}

function prestigeMissing(){ // что ещё нужно для управляющего: всё оборудование, все помощники и весь персонал
  const m=[];
  for(const [k,e] of Object.entries(EQ))if(!S.eq[k])m.push(e.icon+' '+e.name.toLowerCase());
  for(const k of Object.keys(SVC))if((S.help[k]||0)<MGR_LVL)m.push(`🧑 помощник «${SVC[k].name.toLowerCase()}» ур. ${MGR_LVL} (сейчас ${S.help[k]||0})`);
  for(const [k,st] of Object.entries(STAFF)){
    if(k==='desk'){if((S.staff.desk||0)<MGR_LVL)m.push(`${st.icon} ${st.name.toLowerCase()} ур. ${MGR_LVL} (сейчас ${S.staff.desk||0})`)}
    else if(!S.staff[k])m.push(st.icon+' '+st.name.toLowerCase());
  }
  if(S.rooms<MAX_ROOMS)m.push(`🏨 все ${MAX_ROOMS} номеров (сейчас ${S.rooms})`);
  return m;
}

function floatAt(id,text,color,dy){
  if(BG)return;
  const el=$(id);if(!el)return;
  const r=el.getBoundingClientRect();
  const d=document.createElement('div');d.className='fl';d.textContent=text;d.style.color=color;
  d.style.left=(r.left+r.width/2+rnd(-20,20))+'px';d.style.top=(r.top+r.height/2+(dy||0))+'px';
  $('fx').appendChild(d);setTimeout(()=>d.remove(),1100);
}

document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,k=el.dataset.k;
  if(a==='intro'){e.preventDefault();startGame();return}
  if(a==='call')openSheet({type:'call'});
  else if(a==='yes')answer(true);
  else if(a==='no')answer(false);
  else if(a==='queue')answer('queue');
  else if(a==='qtoggle'){qOpen=!qOpen;dirty=true}
  else if(a==='qcall')callBack(+k);
  else if(a==='meet')openSheet({type:'meet',k:+k});
  else if(a==='meetdo'){
    const [id,act]=k.split(':'),p=pet(+id);if(!p)return;
    if(p.did.includes(act))return;
    if(p.meetAct){floatAt('bigpet','Уже заняты 🙂','#8a7a70');return}
    startMeet(p,act);renderSheet();
  }
  else if(a==='checkin')checkIn(+k);
  else if(a==='svc'){const [id,s]=k.split(':');doService(+id,s)}
  else if(a==='pickup')pickup(+k);
  else if(a==='petinfo')openSheet({type:'petinfo',k:+k});
  else if(a==='shop')openSheet({type:'shop'});
  else if(a==='prestige')prestige();
  else if(a==='hotel'){if(+k!==G.active)switchHotel(+k)}
  else if(a==='buy'){buy(el.dataset.what,k);renderSheet()}
  else if(a==='shoptab'){shopTab=k;renderSheet();$('sheetIn').scrollTop=0}
  else if(a==='buyroom'){const c=ROOM_COST[S.rooms];if(S.money>=c)buy('room');else toast(`Новый номер стоит ${fmt(c)} 💰`)}
  else if(a==='close')closeSheet();
  else if(a==='reset'){if(confirm('Начать игру заново? Все отели и звёзды будут сброшены.')){G=freshG();G.hotels.forEach(attach);useHotel(G.hotels[0]);save();closeSheet();dirty=true}}
});
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();hiddenAt=Date.now()}else{last=performance.now();if(hiddenAt){if(!introOn)awardOffline((Date.now()-hiddenAt)/1000);hiddenAt=0}}});
window.addEventListener('pagehide',()=>save());

// ---------- Офлайн-доход ----------
// Пока игра закрыта, время в отелях стоит, но отели с управляющим зарабатывают:
// половина обычного дохода (по последним 10 минутам), максимум за 8 часов.
// Без управляющего, но со всей автоматизацией (все помощники и весь персонал) — офлайн до 30 минут
const OFF_AUTO_MIN=30;
function autoMissing(H){
  const k=KINDS[H.kind],m=[];
  for(const x of Object.keys(k.svc))if(!H.help[x])m.push('🧑 помощник: '+k.svc[x].name.toLowerCase());
  if(!H.staff.phone)m.push('☎️ администратор на телефоне');
  if(!H.staff.desk)m.push('🛎️ администратор на ресепшене');
  if(!H.staff.out)m.push('🚗 сотрудник выдачи');
  return m;
}
const offCap=H=>H.manager?OFF_MAX_H*3600:autoMissing(H).length?0:OFF_AUTO_MIN*60; // секунд
function awardOffline(sec){
  if(!(sec>=60))return;
  const rows=[];let total=0;
  for(const H of G.hotels){
    const cap=Math.min(sec,offCap(H));if(!cap)continue;
    const amt=Math.floor(incomeRate(H)*cap*OFF_SHARE);
    if(amt>0){rows.push([H,amt,cap]);total+=amt}
  }
  if(!total)return;
  G.money+=total;for(const [H,a] of rows)H.earned+=a;
  save();dirty=true;
  openSheet({type:'away',rows,total,sec});
}
const durTxt=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return (h?h+' ч ':'')+m+' мин'};
function awaySheet(){
  const d=sheet,h=Math.floor(d.sec/3600),m=Math.floor(d.sec%3600/60);
  return `<div class="sh-title">🌙 Пока вас не было</div>
    <div class="sh-sub">Вас не было ${h?h+' ч ':''}${m} мин. Персонал присмотрел за отелями.</div>
    ${d.rows.map(([H,a,cap])=>`<div class="row"><span class="ic">${KINDS[H.kind].icon}</span><div><b>${KINDS[H.kind].name}</b><small>${H.manager?'👔 управляющий':'🧑 помощники и персонал'} · ${cap<d.sec?'посчитано '+durTxt(cap)+' (максимум)':durTxt(cap)}</small></div><b style="color:var(--accent2)">+${fmt(a)} 💰</b></div>`).join('')}
    <button class="bigbtn green" data-act="close" style="margin-top:12px;width:100%">Забрать +${fmt(d.total)} 💰</button>`;
}

// ---------- Цикл ----------
// Отели, в которых вас сейчас нет, живут сами: тот же tick(), но без всплывашек и окон
let BG=false;
function bgTick(H,dt){
  const me=S,sh=sheet,qo=qOpen;
  BG=true;sheet=null;useHotel(H);
  try{for(let r=dt;r>0;r-=0.1)tick(Math.min(0.1,r))}
  finally{useHotel(me);sheet=sh;qOpen=qo;BG=false}
}
// Пока игра закрыта, время стоит: гости ждут вас, никто не грустит.
let last=performance.now(),saveAcc=0,sheetAcc=0;
function loop(now){
  if(introOn){last=now;requestAnimationFrame(loop);return} // пока заставка — время стоит
  const dt=Math.min(1,Math.max(0,(now-last)/1000));last=now;
  for(let r=dt;r>0;r-=0.1)tick(Math.min(0.1,r));
  for(const H of G.hotels)if(H!==S)bgTick(H,dt);
  const key=structKey();
  if(dirty||key!==lastKey){lastKey=key;dirty=false;render()}else update();
  sheetAcc+=dt;if(sheetAcc>0.5&&sheet&&(sheet.type==='shop'||sheet.type==='petinfo')){sheetAcc=0;renderSheet()}
  saveAcc+=dt;if(saveAcc>=3){saveAcc=0;save()}
  requestAnimationFrame(loop);
}
// ---------- Заставка при запуске ----------
// Нарезка сцен из жизни отеля, по тапу — в игру. Пока заставка на экране, время в игре стоит.
let introOn=true;
const INTRO_SLIDE=2; // секунд на каждую сцену заставки
const awaySec=G.saved?(Date.now()-G.saved)/1000:0; // офлайн считаем по моменту запуска, а не по закрытию заставки
const SCENES=[
  {hero:photoImg('cat1'),props:[['📞',8,14],['💬',72,10]],cap:'Принимаем звонки'},
  {hero:photoImg('dog1'),props:[['🩺',6,60],['🎾',76,62]],cap:'Знакомимся с гостями'},
  {hero:photoImg('cat3')+photoImg('dog3'),two:true,props:[['🛁',6,12],['🍖',78,14]],cap:'Кормим, моем, стрижём'},
  {hero:photoImg('dog2'),props:[['🛎️',8,12],['🧑',76,58]],cap:'Нанимаем помощников'},
  {hero:PET.rabbit.svg,props:[['🥕',8,58],['⭐',76,10]],cap:'Открываем новые отели'},
  {hero:PET.hamster.svg+PET.parrot.svg,two:true,props:[['🎡',6,12],['💬',78,12]],cap:'Хомяки, кролики, попугаи…'},
];
function showIntro(){
  const el=$('intro');
  const paws=[...Array(10)].map((_,i)=>`<span style="left:${(i*10+rnd(0,6)).toFixed(0)}%;animation-delay:-${rnd(0,9).toFixed(1)}s;animation-duration:${rnd(7,12).toFixed(1)}s">🐾</span>`).join('');
  el.innerHTML=`<div class="paws">${paws}</div>
    <div class="logo">Хвостатый отель<small>гостиница для питомцев</small></div>
    <div class="stage">${SCENES.map((sc,i)=>`<div class="slide ${i?'':'on'}"><div class="disc"><div class="hero ${sc.two?'two':''}">${sc.hero}</div>${sc.props.map(([e,x,y],j)=>`<span class="prop" style="left:${x}%;top:${y}%;animation-delay:${j*.4}s">${e}</span>`).join('')}</div><div class="cap"><span>${sc.cap}</span></div></div>`).join('')}</div>
    <div class="dots">${SCENES.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>
    <div class="tap">Тап для начала</div>
    <div class="ver">версия ${VERSION}</div>`;
  let i=0;
  const t=setInterval(()=>{
    if(!introOn){clearInterval(t);return}
    i++;
    if(i>=SCENES.length){clearInterval(t);startGame();return} // круг прошёл — сами открываем игру
    el.querySelectorAll('.slide').forEach((s,j)=>s.classList.toggle('on',j===i));
    el.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===i));
  },INTRO_SLIDE*1000);
}
function startGame(){
  if(!introOn)return;
  introOn=false;last=performance.now();
  const el=$('intro');el.classList.add('out');setTimeout(()=>el.remove(),600);
  toastOnce('start','👋 Добро пожаловать в «Хвостатый отель»! Ждём первого звонка…');
  if(awaySec)awardOffline(awaySec);
}
render();
showIntro();
requestAnimationFrame(loop);
if('serviceWorker' in navigator){
  // как только встала новая версия — один раз перезагружаемся, чтобы игрок сразу её увидел
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;save();location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    r.update();
    // на телефоне игру обычно сворачивают, а не закрывают — проверяем обновление при каждом возвращении
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})});
  }).catch(()=>{});
}
</script>
</body>
</html>
