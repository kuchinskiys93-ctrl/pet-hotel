<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Хвостатый отель</title>
<meta name="theme-color" content="#fdf3e7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Хвост. отель">
<style>
:root{--bg:#fdf3e7;--card:#fff;--ink:#3b2f2a;--muted:#8a7a70;--accent:#ff8a4c;--accent2:#5bb98c;--bad:#e35d5d;--warn:#f2b134;--line:#ecdac6;--track:#f3e6d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
#app{max-width:480px;margin:0 auto;padding:0 12px 96px}
.head{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:8px;box-shadow:0 8px 8px -8px #0000001f}
.head .phone{margin:0}
.qbar{display:flex;align-items:center;gap:8px;margin-top:6px;background:#fff;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.qbar .arr{margin-left:auto;color:var(--muted);font-size:12px}
.qbar.go{box-shadow:0 0 0 3px var(--accent2)}
.qbar.go .arr{color:var(--accent2)}
.qlist{background:#fff;border-radius:0 0 12px 12px;margin-top:-6px;padding:6px 10px 4px;box-shadow:0 2px 0 var(--line)}
.qi{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--track);font-size:13px}
.qi:first-child{border-top:none}
.qi .av{width:30px;height:30px;font-size:30px;line-height:1;flex:none}
.qi .av svg{width:1em;height:1em}
.qi div{flex:1}.qi small{display:block;color:var(--muted);font-size:11px}
.qi button{border:none;border-radius:10px;padding:7px 10px;font-family:inherit;font-weight:800;font-size:12px;background:var(--accent2);color:#fff;cursor:pointer}
.qi button:disabled{background:#e9ddd0;color:var(--muted);cursor:default}
.head .phone.idle{padding-top:8px;padding-bottom:8px}
.head .phone.idle .ring{width:36px;height:36px;font-size:18px}
.top{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.pill{flex:1;background:var(--card);border-radius:14px;padding:6px 8px;font-weight:800;box-shadow:0 2px 0 var(--line);text-align:center;font-size:16px;white-space:nowrap}
.pill small{display:block;font-weight:500;color:var(--muted);font-size:11px}
h3{margin:14px 2px 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.bar{height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent2);border-radius:4px}
.pv{width:1em;height:1em;display:inline-block;vertical-align:-.15em;overflow:visible}
.card{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 3px 0 var(--line);position:relative}
/* Телефон */
.phone{display:flex;align-items:center;gap:12px;cursor:pointer}
.phone .ring{font-size:30px;width:52px;height:52px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;flex:none;animation:ring .5s infinite}
.phone.idle{cursor:default;opacity:.75}
.phone.idle .ring{background:#e9ddd0;animation:none;font-size:24px}
.phone b{font-size:15px}
.phone small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.phone .ttl{margin-top:6px;height:5px}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.card.calling{box-shadow:0 0 0 3px var(--accent2),0 3px 0 var(--line);animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #5bb98c55,0 3px 0 var(--line)}}
/* Приёмная */
.lobby{display:flex;gap:8px;flex-wrap:wrap}
.guest{flex:1 1 140px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px;box-shadow:0 3px 0 var(--line);cursor:pointer}
.guest .av{font-size:44px;line-height:1}
.guest b{font-size:14px}.guest small{display:block;color:var(--muted);font-size:11px}
.guest.ready{box-shadow:0 0 0 3px var(--accent),0 3px 0 var(--line)}
.guest.ready .av{animation:hopin 1s infinite}
.guest.coming{cursor:default}
.guest>div:last-child{flex:1;min-width:0}
.guest.busy{box-shadow:0 0 0 3px var(--accent2),0 3px 0 var(--line)}
.guest.busy .av{animation:none}
.gsteps{display:flex;gap:4px;margin-top:5px}
.gsteps span{font-size:13px;width:24px;height:24px;border-radius:8px;background:#f3ebe1;display:flex;align-items:center;justify-content:center;opacity:.55}
.gsteps span.ok{background:#e7f6ee;opacity:1}
.gsteps span.now{background:#fff7ec;box-shadow:0 0 0 2px var(--accent2);opacity:1;animation:pulse 1s infinite}
.guest .bar{height:5px;margin-top:5px}
.guest.coming .av{animation:drive 1.2s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes hopin{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.empty-note{color:var(--muted);font-size:13px;padding:6px 4px}
/* Номера */
.rooms{display:flex;flex-direction:column;gap:12px}
.rcard{background:linear-gradient(#fff 0 62%,#f7ecdd 62%);border-radius:20px;padding:12px;box-shadow:0 3px 0 var(--line);position:relative;overflow:hidden}
.rcard.free{background:repeating-linear-gradient(135deg,#fbf4ea 0 12px,#f7ecdf 12px 24px);color:var(--muted)}
.rcard.add{background:#fbf4ea;border:2px dashed #d4b48f;box-shadow:none;text-align:center;color:var(--muted);cursor:pointer;padding:16px}
.rcard.add b{display:block;font-size:24px;color:var(--accent)}
.rcard.pickup{box-shadow:0 0 0 3px var(--accent),0 3px 0 var(--line)}
.rhead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.tar{background:#fff3e6;color:#b4692e;border-radius:8px;padding:2px 8px;font-weight:800}
.rbody{display:flex;gap:12px;align-items:center;margin-top:6px}
.petbox{position:relative;width:96px;height:96px;flex:none;cursor:pointer}
.petbox .bed{position:absolute;left:4px;right:4px;bottom:2px;height:30px;border-radius:50%;background:radial-gradient(#ffd9b3,#f0b27a);box-shadow:inset 0 -4px 0 #d98e4f}
.petbox .bowl{position:absolute;right:-6px;bottom:0;font-size:20px}
.petbox .pet{position:absolute;left:14px;bottom:14px;font-size:68px;line-height:1;animation:idle 2.6s ease-in-out infinite;transform-origin:50% 100%}
.petbox .fx{position:absolute;left:0;right:0;top:-6px;text-align:center;font-size:24px;pointer-events:none}
.rinfo{flex:1;min-width:0}
.rinfo .nm{font-weight:800;font-size:16px}
.rinfo .nm small{font-weight:600;color:var(--muted);font-size:12px}
.lbl{font-size:11px;color:var(--muted);margin:6px 0 3px;display:flex;justify-content:space-between}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.svc{flex:1 1 0;min-width:58px;position:relative;border:none;background:#f3ebe1;border-radius:14px;padding:8px 4px 6px;font-family:inherit;font-size:22px;cursor:pointer;color:var(--ink);overflow:hidden}
.svc small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;line-height:1.15}
.svc .cnt{position:absolute;right:5px;top:3px;font-size:10px;font-weight:800;color:var(--muted)}
.svc.req{background:#fff;box-shadow:0 0 0 3px var(--accent);animation:pulse 1s infinite}
.svc.req small{color:var(--accent)}
.svc.doing{background:#e7f6ee;box-shadow:0 0 0 3px var(--accent2)}
.svc.can{background:#4a8fe0;color:#fff;box-shadow:0 3px 0 #2f6db8;animation:pulse 1.2s infinite}
.svc.can small,.svc.can .cnt{color:#fff}
.svc.done{opacity:.45}
.svc.cd{opacity:.6;background:#efe6da}
.svc.cd small{color:var(--muted)}
.svc .prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent2)}
.svc .help{position:absolute;left:4px;top:2px;font-size:11px}
@keyframes pulse{50%{transform:scale(1.05)}}
.pickbtn{width:100%;margin-top:10px;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:12px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;animation:pulse 1.2s infinite}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
/* анимации ухода */
.a-food .pet{animation:chomp .35s infinite}
@keyframes chomp{50%{transform:translateY(4px) scale(1.04,.94)}}
.a-wash .pet{animation:wiggle .4s infinite}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.a-groom .pet{animation:idle .8s infinite}
.a-walk .pet{animation:hop .35s infinite}
@keyframes hop{50%{transform:translateY(-12px) rotate(-4deg)}}
.a-play .pet{animation:spin 1s infinite}
@keyframes spin{0%{transform:rotate(0)}25%{transform:rotate(-12deg) translateY(-8px)}50%{transform:rotate(0) translateY(0)}75%{transform:rotate(12deg) translateY(-8px)}}
.fx span{display:inline-block;animation:floatup 1.2s ease-in infinite;opacity:0}
.fx span:nth-child(2){animation-delay:.4s}.fx span:nth-child(3){animation-delay:.8s}
@keyframes floatup{0%{transform:translateY(20px);opacity:0}30%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
/* Низ, листы */
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center;z-index:6}
.bigbtn{max-width:456px;width:100%;background:var(--ink);color:#fff;border:none;border-radius:16px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.bigbtn.green{background:var(--accent2)}.bigbtn.ghost{background:#e9ddd0;color:var(--ink)}
.bigbtn:disabled{background:#cbbfb4}
#back{position:fixed;inset:0;background:#0006;z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:none;justify-content:center}
#sheet .in{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.sh-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin-bottom:4px}
.sh-sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.sh-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 2px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-top:8px;box-shadow:0 2px 0 var(--line)}
.row .ic{font-size:26px}
.row div{flex:1}
.row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.buy{background:var(--accent2);color:#fff;border:none;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;min-width:92px;cursor:pointer;font-family:inherit}
.buy:disabled{background:#cbbfb4}
.buy.done{background:transparent;color:var(--accent2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stats div{background:var(--card);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:16px}
.link{background:none;border:none;color:var(--bad);margin-top:16px;font-size:13px;cursor:pointer;font-family:inherit}
/* Звонок и знакомство */
.bigpet{font-size:110px;text-align:center;line-height:1;margin:6px 0;animation:idle 2.4s ease-in-out infinite}
.bigpet.react{animation:hopin .5s 2}
.bubble{background:#fff;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.35;box-shadow:0 2px 0 var(--line);margin:4px 0 12px}
.choices{display:flex;gap:8px}
.choices button{flex:1}
.acts3{display:flex;gap:8px;margin:6px 0 4px}
.acts3 button{flex:1;border:none;background:#fff;border-radius:14px;padding:10px 4px;font-size:24px;font-family:inherit;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.acts3 button small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.acts3 button{position:relative;overflow:hidden}
.acts3 button.did{background:#e7f6ee}
.acts3 button.doing{background:#fff7ec;box-shadow:0 0 0 3px var(--accent2)}
.acts3 .prog{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--accent2)}
.meet-mood{text-align:center;font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 4px}
.meet-mood b{color:var(--accent2)}
.react-txt{text-align:center;font-weight:700;min-height:22px;color:#b4692e;margin:6px 0}
.tarif{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px;font-family:inherit;cursor:pointer;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.tarif .ic{font-size:26px}
.tarif div{flex:1}
.tarif b{font-size:15px}.tarif small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tarif .pr{font-weight:900;color:var(--accent2);font-size:14px;white-space:nowrap}
.needs{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 2px 0 var(--line)}
.needs .nd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:3px 0}
.needs .nd span{font-size:18px}
.needs .nd.off{color:var(--muted);font-weight:600}
.needs .hint{font-size:12px;color:var(--muted);padding:3px 0}
.tarif:disabled{opacity:.5;cursor:default}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.fl{position:absolute;font-weight:900;font-size:18px;transform:translate(-50%,-50%);animation:fl 1.1s ease-out forwards;text-shadow:0 1px 0 #fff;white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-160%);opacity:0}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:25;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="bottom"><button class="bigbtn" data-act="shop">🛒 Магазин и прокачка</button></div>
<div id="back" data-act="close"></div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="fx"></div>
<div id="toast"></div>
<script>
'use strict';
// ---------- Модельки питомцев (SVG, размер = font-size) ----------
function catSvg(){
  return `<svg class="pv" viewBox="0 0 64 64">
    <path d="M9 34 L12 5 L29 19 Z" fill="#26262e"/><path d="M55 34 L52 5 L35 19 Z" fill="#26262e"/>
    <path d="M14 26 L15 12 L24 20 Z" fill="#e88aa0"/><path d="M50 26 L49 12 L40 20 Z" fill="#e88aa0"/>
    <ellipse cx="32" cy="38" rx="24" ry="20" fill="#26262e"/>
    <ellipse cx="22.5" cy="35" rx="5.5" ry="6.5" fill="#d9e84a"/><ellipse cx="41.5" cy="35" rx="5.5" ry="6.5" fill="#d9e84a"/>
    <ellipse cx="22.5" cy="35" rx="1.8" ry="5.2" fill="#111"/><ellipse cx="41.5" cy="35" rx="1.8" ry="5.2" fill="#111"/>
    <circle cx="20.5" cy="32" r="1.4" fill="#fff"/><circle cx="39.5" cy="32" r="1.4" fill="#fff"/>
    <path d="M29 44 L35 44 L32 47.5 Z" fill="#f08aa6"/>
    <path d="M32 47.5 Q29 51 26 49 M32 47.5 Q35 51 38 49" stroke="#5a5a66" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M6 42 L20 44 M6 48 L20 46 M58 42 L44 44 M58 48 L44 46" stroke="#8b8b98" stroke-width="1.1" stroke-linecap="round"/>
  </svg>`;
}
function spitzSvg(){
  let fluff='';
  for(let i=0;i<14;i++){const a=i/14*Math.PI*2;fluff+=`<circle cx="${(32+23*Math.cos(a)).toFixed(1)}" cy="${(37+21*Math.sin(a)).toFixed(1)}" r="8" fill="#e8892f"/>`;}
  return `<svg class="pv" viewBox="0 0 64 64">
    ${fluff}
    <circle cx="15" cy="15" r="9.5" fill="#d97a22"/><circle cx="49" cy="15" r="9.5" fill="#d97a22"/>
    <circle cx="15.5" cy="15.5" r="5.2" fill="#fbd3a0"/><circle cx="48.5" cy="15.5" r="5.2" fill="#fbd3a0"/>
    <circle cx="32" cy="37" r="21" fill="#f4a64c"/>
    <ellipse cx="32" cy="45" rx="12" ry="9" fill="#fde6c2"/>
    <circle cx="24" cy="34" r="3.8" fill="#1d1410"/><circle cx="40" cy="34" r="3.8" fill="#1d1410"/>
    <circle cx="25.2" cy="32.8" r="1.2" fill="#fff"/><circle cx="41.2" cy="32.8" r="1.2" fill="#fff"/>
    <ellipse cx="32" cy="41.5" rx="3.6" ry="2.7" fill="#1d1410"/>
    <path d="M32 44 L32 46 M27.5 46 Q32 50 36.5 46" stroke="#1d1410" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M30 47.5 Q32 53 34 47.5 Z" fill="#f07c8c"/>
  </svg>`;
}

// ---------- Данные ----------
const VERSION='2.0.4';
const SAVE_KEY='pethotel_v3'; // 2.0 — новая игра; сохранения 1.x не трогаем
const PET={
  cat:{svg:catSvg(),kind:'кот',whose:'кота',names:['Мурзик','Уголёк','Ночка','Багира','Тень','Маркиз','Луна','Пантера','Сажа','Черныш'],
    likes:['любит рыбку','спит на подоконнике','боится пылесоса','обожает коробки','мурлычет как трактор'],
    react:{play:['Ловит лапкой бантик 🎀','Охотится на пёрышко!','Гоняет клубочек 🧶'],check:['Здоров! Шёрстка блестит ✨','Ушки чистые, глазки ясные 👀','Коготки в порядке 🐾'],pet:['Мурр-мурр 💕','Подставляет щёчку 🥰','Трётся о руку 💞']}},
  dog:{svg:spitzSvg(),kind:'шпиц',whose:'шпица',names:['Бублик','Пончик','Рыжик','Персик','Тедди','Мишка','Лиса','Пушок','Кекс','Сёмка'],
    likes:['любит мячики','обожает гулять','немного трусишка','любит, когда чешут пузико','громко радуется гостям'],
    react:{play:['Принёс мячик! 🎾','Носится кругами 🌀','Виляет хвостом без остановки 🐾'],check:['Здоров! Нос холодный 👃','Зубки в порядке 🦷','Лапки чистые 🐾'],pet:['Перевернулся на спинку 💕','Лизнул руку 😊','Улыбается во весь рот 😄']}},
};
const SVC={
  food:{icon:'🍖',name:'Покормить',short:'Покормить',time:4,fx:['🍖','😋','🍖']},
  wash:{icon:'🛁',name:'Помыть',short:'Помыть',time:6,fx:['🫧','🫧','🫧'],eq:'bath'},
  groom:{icon:'✂️',name:'Подстричь',short:'Подстричь',catShort:'Подстричь когти',time:6,fx:['✂️','✨','✂️'],eq:'groom'},
  walk:{icon:'🌳',name:'Выгулять',short:'Выгулять',time:8,fx:['🌳','🐾','🐾'],eq:'yard'},
  play:{icon:'🧸',name:'Поиграть',short:'Поиграть',time:5,fx:['🧸','💕','🎾'],eq:'toys'},
};
// Пожелания гостей: выявляются на осмотре, из них собирается комплекс
const NEED={
  wash:{cat:'Шёрстка запылилась',dog:'Шерсть в грязи после дороги'},
  groom:{cat:'Длинные когти',dog:'Шерсть отросла, лезет в глаза'},
  walk:{dog:'Засиделся, нужно побегать'},
  play:{cat:'Скучает, хочет поиграть',dog:'Хочет поиграть с игрушками'},
};
const SVC_PRICE={food:10,wash:12,groom:13,walk:18,play:17};
const TAR={
  hotel:{name:'Отель',icon:'🛏️',price:20,stay:60,desc:'Мягкая лежанка и еда',eq:[],svc:['food','food']},
  care:{name:'Отель + уход',icon:'🛁',price:45,stay:90,desc:'+ мытьё и стрижка (кошкам — когтики)',eq:['bath','groom'],svc:['food','food','wash','groom']},
  play:{name:'Отель + уход + игра',icon:'🧸',price:80,stay:120,desc:'+ прогулка и игры',eq:['bath','groom','yard','toys'],svc:['food','food','food','wash','groom','walk','play']},
};
const EQ={
  bath:{name:'Ванночка',icon:'🛁',cost:120,desc:'Можно мыть гостей'},
  groom:{name:'Машинка и гравер',icon:'✂️',cost:150,desc:'Стрижка шпицев и когтики кошкам'},
  yard:{name:'Дворик',icon:'🌳',cost:300,desc:'Прогулки на свежем воздухе'},
  toys:{name:'Игрушки',icon:'🧸',cost:250,desc:'Мячики, бантики и пищалки'},
};
const HELP={food:300,wash:500,groom:500,walk:700,play:600};
const STAFF={
  phone:{icon:'☎️',name:'Администратор на телефоне',desc:'Сам отвечает на звонки. Если мест нет — записывает гостя в очередь, а вы перезваниваете, когда освободится номер',cost:350},
  desk:{icon:'🛎️',name:'Администратор на ресепшене',desc:'Сам знакомится с приехавшим и заселяет на лучший доступный тариф',cost:600},
  out:{icon:'🚗',name:'Сотрудник выдачи',desc:'Сам отдаёт питомца хозяину, когда за ним приехали',cost:450},
};
const ROOM_COST=[0,0,200,450,900,1800]; const MAX_ROOMS=6, MAX_LVL=10;

function fresh(){
  return {v:3,money:60,reviews:[5,5,4],rooms:2,eq:{bath:false,groom:false,yard:false,toys:false},
    lvl:{food:0,wash:0,groom:0,walk:0,play:0},help:{food:false,wash:false,groom:false,walk:false,play:false},staff:{phone:false,desk:false,out:false},
    pets:[],queue:[],seq:1,t:0,call:null,nextCall:3,served:0,declined:0,missed:0,earned:0,tips:{}};
}
let S=load()||fresh();
if(!S.queue)S.queue=[];
if(!S.staff)S.staff={phone:false,desk:false,out:false};
for(const p of S.pets){p.cd=p.cd||{};if(p.idleAt==null)p.idleAt=0}

// ---------- Утилиты ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const $=id=>document.getElementById(id);
function fmt(n){n=Math.floor(n);if(n<1000)return ''+n;const u=['K','M','B'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:1).replace(/\.?0+$/,'')+u[i]}
const years=a=>a===1?'год':a<5?'года':'лет';
const rating=()=>S.reviews.reduce((a,b)=>a+b,0)/S.reviews.length;
const pet=id=>S.pets.find(p=>p.id===id);
const svcTime=k=>SVC[k].time*Math.pow(0.85,S.lvl[k]);
const lvlCost=k=>Math.round(25*Math.pow(1.8,S.lvl[k]));
const tarOpen=k=>TAR[k].eq.every(e=>S.eq[e]);
const svcOpen=k=>!SVC[k].eq||S.eq[SVC[k].eq];
const svcName=(k,p)=>k==='groom'&&p&&p.type==='cat'?SVC.groom.catShort:SVC[k].short;
const busySlots=()=>S.pets.length;
const freeSlots=()=>S.rooms-busySlots();
function freeRoom(){const u=new Set(S.pets.filter(p=>p.room!=null).map(p=>p.room));for(let i=0;i<S.rooms;i++)if(!u.has(i))return i;return -1}
function save(){S.saved=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null}catch(e){return null}}

// ---------- Логика ----------
function newGuest(){
  const type=Math.random()<0.5?'cat':'dog',T=PET[type];
  const needs=Object.keys(NEED).filter(k=>NEED[k][type]&&Math.random()<0.5);
  return {type,name:pick(T.names),age:Math.floor(rnd(1,12)),like:pick(T.likes),needs};
}
const callGap=()=>rnd(14,26)*Math.sqrt(5/Math.max(2.5,rating()));
function answer(yes,auto){
  const c=S.call;if(!c)return;
  S.call=null;S.nextCall=callGap();if(sheet&&sheet.type==='call')closeSheet();
  const who=auto?'☎️ Администратор: ':'';
  if(yes==='queue'||(!yes&&auto&&S.queue.length<QUEUE_MAX)){
    if(S.queue.length>=QUEUE_MAX){toast('📋 Очередь заполнена');S.declined++;return}
    S.queue.push({id:S.seq++,pet:c.pet,exp:S.t+QUEUE_TTL});
    toast(who+`📋 ${c.pet.name} в очереди — позвоните, когда освободится номер`);return}
  if(!yes){S.declined++;toast(who+(auto?'мест нет, вежливо отказал':'📵 Вы вежливо отказали. Позвонят ещё!'));return}
  admit(c.pet);
  toast(who+`🚗 ${c.pet.name} уже едет к вам!`);
}
const QUEUE_MAX=5, QUEUE_TTL=180; // сколько ждут в очереди, прежде чем найдут другой отель
function admit(g){S.pets.push({id:S.seq++,...g,state:'coming',eta:5,room:null,tariff:null,mood:100,stay:0,total:0,reqs:[],act:null,did:[]})}
let qOpen=false;
function callBack(qid){ // перезваниваем гостю из очереди
  const i=S.queue.findIndex(q=>q.id===qid);if(i<0)return;
  if(freeSlots()<=0){toast('Сначала освободите номер 🙂');return}
  const g=S.queue.splice(i,1)[0].pet;admit(g);
  toast(`📞 Дозвонились! ${g.name} уже едет к вам`);
  if(!S.queue.length)qOpen=false;
}
// Что видно после осмотра (только услуги, на которые есть оборудование)
const knownNeeds=p=>p.did.includes('check')?(p.needs||[]).filter(svcOpen):[];
const hiddenNeeds=p=>(p.needs||[]).filter(k=>svcOpen(k)&&!knownNeeds(p).includes(k));
function plan(p){
  const extra=knownNeeds(p);
  const food=extra.length>=3?3:2;
  const list=[...Array(food).fill('food'),...extra];
  const tk=extra.some(k=>k==='walk'||k==='play')?'play':extra.length?'care':'hotel';
  return {list,tk,stay:60+15*extra.length,price:list.reduce((a,k)=>a+SVC_PRICE[k],0)};
}
function checkIn(id,auto){ // заселяем с комплексом по выявленным нуждам
  const p=pet(id);if(!p||p.state!=='arrived')return;
  const r=freeRoom();if(r<0)return;
  const P=plan(p),tk=P.tk;
  const list=P.list;
  p.price=P.price;p.hidden=hiddenNeeds(p);
  const total=P.stay*rnd(0.9,1.1);
  p.reqs=list.map(svc=>({svc,done:false,miss:false}));p.cd={};p.idleAt=S.t;
  Object.assign(p,{state:'room',room:r,tariff:tk,stay:total,total,mood:meetMood(p)});p.meetAct=null;
  if(sheet&&sheet.type==='meet'&&sheet.k===id)closeSheet();
  toast((auto?'🛎️ Администратор: ':'')+`🏨 ${p.name} заселился в номер ${r+1}`);
  setTimeout(()=>toastOnce('care','👀 Выбирайте сами, что делать: каждая процедура поднимает настроение'),2900);
}
const MOOD0=60, REPEAT_CD=12; // настроение после полного знакомства; пауза перед повтором той же процедуры
const MOOD_NOMEET=35; // если не знакомились совсем
const MEET={play:{icon:'🎾',name:'Поиграть',time:5,fx:'🎾'},check:{icon:'🩺',name:'Осмотреть',time:6,fx:'✨'},pet:{icon:'🤚',name:'Почесать',time:4,fx:'💕'}};
const meetMood=p=>Math.round(MOOD_NOMEET+(MOOD0-MOOD_NOMEET)*p.did.length/3);
function startMeet(p,k){
  if(!p||p.state!=='arrived'||p.meetAct||p.did.includes(k))return false;
  const t=MEET[k].time;p.meetAct={k,left:t,total:t};return true;
}
const onCd=(p,svc)=>p.cd&&p.cd[svc]>S.t;
const activeReq=(p,svc)=>p.reqs.find(r=>!r.done&&!r.miss&&(!svc||r.svc===svc));
function doService(id,svc,byHelper){
  const p=pet(id);if(!p||p.state!=='room')return;
  if(p.act){if(!byHelper)floatAt('room-'+p.room,'Уже занят 🙂','#8a7a70');return}
  const r=activeReq(p,svc);
  if(!r){if(!byHelper)floatAt('room-'+p.room,'Уже сделано ✅','#8a7a70');return}
  if(onCd(p,svc)){if(!byHelper)floatAt('room-'+p.room,`${p.name} отдыхает, позже 🙂`,'#8a7a70');return}
  const t=svcTime(svc);p.act={svc,left:t,total:t,help:!!byHelper};
}
function pickup(id){
  const p=pet(id);if(!p||p.state!=='pickup')return;
  const T=TAR[p.tariff],price=p.price||T.price;
  const stars=p.mood>=85?5:p.mood>=65?4:p.mood>=45?3:p.mood>=25?2:1;
  let amt=price*(0.5+p.mood/100*0.7);if(stars===5)amt*=1.2;
  amt=Math.max(1,Math.round(amt));
  S.money+=amt;S.earned+=amt;S.served++;S.reviews.push(stars);if(S.reviews.length>20)S.reviews.shift();
  floatAt('room-'+p.room,'+'+amt+' 💰','#2f9a68');floatAt('room-'+p.room,'⭐'.repeat(stars),'#e0a100',22);
  const hid=(p.hidden||[]).map(k=>NEED[k][p.type].toLowerCase());
  toast(hid.length?`😕 Хозяин заметил: ${hid.join(', ')}`:stars>=5?`💖 Хозяин ${p.name} в восторге!`:stars>=4?'😊 Хозяин доволен':'😕 Хозяин ожидал большего');
  S.pets=S.pets.filter(x=>x!==p);
}
function tick(dt){
  S.t+=dt;
  // звонки
  if(S.call){S.call.ttl-=dt;if(S.call.ttl<=0){S.call=null;S.missed++;S.nextCall=callGap();if(sheet&&sheet.type==='call')closeSheet();toast('📞 Пропущенный звонок')}}
  else{S.nextCall-=dt;if(S.nextCall<=0){S.call={pet:newGuest(),ttl:25,max:25};if(!S.staff.phone)toastOnce('call','📞 Звонят! Тапни по телефону, чтобы ответить')}}
  if(S.call&&S.staff.phone&&S.call.max-S.call.ttl>=3)answer(freeSlots()>0,true);
  for(const q of [...S.queue])if(S.t>=q.exp){S.queue=S.queue.filter(x=>x!==q);S.missed++;toast(`📋 ${q.pet.name} не дождался и нашёл другой отель`)}
  if(S.queue.length&&freeSlots()>0)toastOnce('qfree','📋 Освободился номер — разверните очередь и позвоните гостю');
  for(const p of [...S.pets]){
    if(p.state==='coming'){p.eta-=dt;if(p.eta<=0){p.state='arrived';p.since=S.t;if(!S.staff.desk)toastOnce('arrive',`🐾 ${p.name} приехал — тапни, чтобы познакомиться`)}}
    else if(p.state==='arrived'){
      const open=sheet&&sheet.type==='meet'&&sheet.k===p.id;
      if(p.meetAct){p.meetAct.left-=dt;if(p.meetAct.left<=0){
        const k=p.meetAct.k;p.meetAct=null;if(!p.did.includes(k))p.did.push(k);
        p.react=pick(PET[p.type].react[k]);
        if(k==='check'){const f=(p.needs||[]).map(x=>NEED[x][p.type].toLowerCase());if(f.length)p.react='Осмотр: '+f.join(', ')+' 📝'}
        if(open){renderSheet();const bp=$('bigpet');if(bp){bp.classList.add('react');setTimeout(()=>bp.classList.remove('react'),1000)}floatAt('bigpet',MEET[k].fx,'#e05a8a')}
      }}
      else if(S.staff.desk&&S.t-(p.since||0)>=3&&!open){ // администратор сам знакомится, потом заселяет
        const next=Object.keys(MEET).find(k=>!p.did.includes(k));
        if(next)startMeet(p,next);
        else checkIn(p.id,true);
      }
    }
    else if(p.state==='room'){
      if(p.act){p.act.left-=dt;if(p.act.left<=0){const r=activeReq(p,p.act.svc);if(r){r.done=true;p.mood=Math.min(100,p.mood+(100-MOOD0)/p.reqs.length)}p.cd[p.act.svc]=S.t+REPEAT_CD;p.act=null;p.idleAt=S.t}}
      p.stay-=dt;
      const left=p.reqs.filter(r=>!r.done&&!r.miss);
      if(left.length&&!p.act)p.mood=Math.max(0,p.mood-0.15*dt); // без внимания понемногу скучает
      if(!p.act&&S.t-(p.idleAt||0)>=4)for(const r of left)if(S.help[r.svc]&&!onCd(p,r.svc)){doService(p.id,r.svc,true);toastOnce('helper','🧑 Помощник сам взялся за дело!');break}
      if(p.stay<=0&&!p.act){
        for(const r of p.reqs)if(!r.done){r.miss=true;p.mood=Math.max(0,p.mood-15)}
        p.mood=Math.max(0,p.mood-15*(p.hidden||[]).length); // не заметили нужду на осмотре
        p.state='pickup';p.since=S.t;if(!S.staff.out)toastOnce('pick',`🚗 За ${p.name} приехали — нажми «Отдать хозяину»`);
      }
    } else if(p.state==='pickup'){p.mood=Math.max(0,p.mood-0.4*dt);if(S.staff.out&&S.t-(p.since||0)>=2)pickup(p.id)}
  }
}

// ---------- Покупки ----------
function buy(what,k){
  let c=0,ok=false;
  if(what==='eq'){if(S.eq[k])return;c=EQ[k].cost;if(S.money>=c){S.eq[k]=true;ok=true;toast(`${EQ[k].icon} Куплено: ${EQ[k].name}`);const sv=Object.keys(SVC).find(x=>SVC[x].eq===k);if(sv)setTimeout(()=>toast(`🎉 Теперь гостям можно: ${SVC[sv].name.toLowerCase()}`),1400)}}
  if(what==='room'){if(S.rooms>=MAX_ROOMS)return;c=ROOM_COST[S.rooms];if(S.money>=c){S.rooms++;ok=true;toast('🛏️ Новый номер готов!')}}
  if(what==='lvl'){if(S.lvl[k]>=MAX_LVL)return;c=lvlCost(k);if(S.money>=c){S.lvl[k]++;ok=true}}
  if(what==='help'){if(S.help[k])return;c=HELP[k];if(S.money>=c){S.help[k]=true;ok=true;toast(`🧑 Помощник: «${SVC[k].name}» теперь сам`)}}
  if(what==='staff'){if(S.staff[k])return;c=STAFF[k].cost;if(S.money>=c){S.staff[k]=true;ok=true;toast(`${STAFF[k].icon} В команде: ${STAFF[k].name.toLowerCase()}`)}}
  if(ok){S.money-=c;save();dirty=true}
}

// ---------- Отрисовка ----------
// Полная перерисовка — только когда меняется «состав» экрана (иначе анимации бы постоянно перезапускались);
// цифры и полоски обновляются на месте каждый кадр
let sheet=null,dirty=true,lastKey='';
function structKey(){
  return [S.rooms,qOpen,freeSlots()>0,S.queue.map(q=>q.id).join(','),S.call?S.call.pet.name:'',Object.values(S.eq).join(''),Object.values(S.help).join(''),Object.values(S.staff).join(''),
    S.pets.map(p=>[p.id,p.state,p.room,p.tariff,p.did.length,p.meetAct?p.meetAct.k:'',p.act?p.act.svc+(p.act.help?'h':''):'',p.reqs.map(r=>r.done?'d':r.miss?'m':onCd(p,r.svc)?'c':'o').join('')].join(':')).join('|')].join('#');
}
function phoneCard(){
  const adm=S.staff.phone;
  if(!S.call)return `<div class="card phone idle"><div class="ring">📞</div><div><b>Телефон молчит</b><small>${adm?'☎️ Администратор на связи':'Скоро кто-нибудь позвонит…'}</small></div></div>`;
  const g=S.call.pet;
  return `<div class="card phone calling" data-act="call"><div class="ring">📞</div><div style="flex:1"><b>Входящий звонок!</b><small>Звонят насчёт ${PET[g.type].whose} по кличке ${g.name} · ${adm?'☎️ администратор берёт трубку…':'тапни, чтобы ответить'}</small><div class="bar ttl"><i data-w="ttl"></i></div></div></div>`;
}
function queueHTML(){
  if(!S.staff.phone||!S.queue.length)return '';
  const can=freeSlots()>0;
  return `<div class="qbar ${can?'go':''}" data-act="qtoggle">📋 Очередь: ${S.queue.length}<span class="arr">${can?'есть место! ':''}${qOpen?'свернуть ▴':'развернуть ▾'}</span></div>`+
    (qOpen?`<div class="qlist">${S.queue.map(q=>`<div class="qi"><span class="av">${PET[q.pet.type].svg}</span><div><b>${q.pet.name}</b><small>${PET[q.pet.type].kind}, ${q.pet.age} ${years(q.pet.age)} · ждёт ещё <span data-x="qexp:${q.id}"></span></small></div><button data-act="qcall" data-k="${q.id}" ${can?'':'disabled'}>📞 Позвонить</button></div>`).join('')}</div>`:'');
}
function lobbyHTML(){
  const L=S.pets.filter(p=>p.state==='coming'||p.state==='arrived');
  if(!L.length)return `<div class="empty-note">Здесь появятся гости, когда вы примете звонок.</div>`;
  return `<div class="lobby">${L.map(p=>p.state==='coming'
    ?`<div class="guest coming"><div class="av">🚗</div><div><b>${p.name} едет</b><small>будет через <span data-x="eta:${p.id}"></span> с</small></div></div>`
    :guestReadyHTML(p)).join('')}</div>`;
}
function guestReadyHTML(p){ // карточка в приёмной: видно, как идёт знакомство (ваше или администратора)
  const adm=S.staff.desk,busy=p.meetAct||(adm&&p.did.length);
  const steps=`<div class="gsteps">${Object.entries(MEET).map(([k,m])=>`<span class="${p.did.includes(k)?'ok':p.meetAct&&p.meetAct.k===k?'now':''}">${p.did.includes(k)?'✅':m.icon}</span>`).join('')}</div>`;
  const who=adm?'🛎️ Администратор':'Вы';
  const txt=p.meetAct?`${who}: ${MEET[p.meetAct.k].name.toLowerCase()}…`
    :p.did.length>=3?(adm?'🛎️ Администратор заселяет…':'знакомство пройдено — можно заселять')
    :adm?'🛎️ Администратор сейчас подойдёт':'тапни, чтобы познакомиться';
  return `<div class="guest ${busy?'busy':'ready'}" data-act="meet" data-k="${p.id}"><div class="av">${PET[p.type].svg}</div><div><b>${p.name} приехал!</b><small>${txt}</small>${steps}${p.meetAct?`<div class="bar"><i data-w="meet:${p.id}" style="background:var(--accent2)"></i></div>`:''}</div></div>`;
}
function roomHTML(i){
  const p=S.pets.find(x=>x.room===i);
  if(!p)return `<div class="rcard free" id="room-${i}"><div class="rhead"><span>Номер ${i+1}</span><span>свободен</span></div>
    <div class="rbody"><div class="petbox"><div class="bed"></div><div class="bowl">🥣</div></div><div class="rinfo" style="font-size:13px">Чистая лежанка и миска ждут гостя</div></div></div>`;
  const T=TAR[p.tariff],kinds=Object.keys(SVC).filter(k=>p.reqs.some(r=>r.svc===k)); // всегда в одном порядке: еда, мытьё, стрижка, прогулка, игра
  const anim=p.act?'a-'+p.act.svc:'';
  const fxs=p.act?SVC[p.act.svc].fx.map(e=>`<span>${e}</span>`).join(''):'';
  const btns=kinds.map(k=>{
    const all=p.reqs.filter(r=>r.svc===k),done=all.filter(r=>r.done).length;
    const req=activeReq(p,k),doing=p.act&&p.act.svc===k;
    const cd=!doing&&req&&onCd(p,k);
    const cls=doing?'doing':done===all.length?'done':cd?'cd':p.act?'':'can'; // можно делать прямо сейчас — яркая кнопка
    return `<button class="svc ${cls}" data-act="svc" data-k="${p.id}:${k}">${S.help[k]?'<span class="help">🧑</span>':''}<span class="cnt">${done}/${all.length}</span>${SVC[k].icon}<small>${doing&&p.act.help?'помощник':cd?'отдыхает':svcName(k,p)}</small>${doing?`<i class="prog" data-w="act:${p.id}"></i>`:''}</button>`;
  }).join('');
  const pick=p.state==='pickup';
  return `<div class="rcard ${pick?'pickup':''}" id="room-${i}">
    <div class="rhead"><span>Номер ${i+1}</span><span class="tar">${T.icon} ${T.name}</span></div>
    <div class="rbody"><div class="petbox ${anim}" data-act="petinfo" data-k="${p.id}"><div class="bed"></div><div class="bowl">🥣</div><div class="pet">${PET[p.type].svg}</div><div class="fx">${fxs}</div></div>
      <div class="rinfo"><div class="nm">${p.name} <small>${PET[p.type].kind}, ${p.age} ${years(p.age)}</small></div>
        <div class="lbl"><span>Настроение</span><span data-x="mood:${p.id}"></span></div><div class="bar"><i data-w="mood:${p.id}"></i></div>
        <div class="lbl"><span>${pick?'Хозяин ждёт':'До отъезда'}</span><span data-x="left:${p.id}"></span></div><div class="bar"><i data-w="stay:${p.id}" style="background:#9fb7e8"></i></div>
      </div></div>
    ${pick?`<button class="pickbtn" data-act="pickup" data-k="${p.id}">🚗 Отдать хозяину</button>`:`<div class="acts">${btns}</div>`}
  </div>`;
}
function render(){
  $('app').innerHTML=`<div class="head">
    <div class="top">
      <div class="pill"><span data-x="money"></span> 💰<small>монеты</small></div>
      <div class="pill"><span data-x="rating"></span> ⭐<small>рейтинг</small></div>
      <div class="pill">${busySlots()}/${S.rooms} 🐾<small>гостей</small></div>
    </div>
    ${phoneCard()}${queueHTML()}</div>
    <h3><span>Приёмная</span></h3>${lobbyHTML()}
    <h3><span>Номера</span></h3>
    <div class="rooms">${[...Array(S.rooms)].map((_,i)=>roomHTML(i)).join('')}
      ${S.rooms<MAX_ROOMS?`<div class="rcard add" data-act="buyroom"><b>＋</b>Новый номер · ${fmt(ROOM_COST[S.rooms])} 💰</div>`:''}</div>`;
  update();
}
function update(){ // каждый кадр: только цифры и полоски
  for(const el of document.querySelectorAll('#app [data-w],#sheet [data-w]')){
    const [k,id]=el.dataset.w.split(':');let w=0;
    if(k==='ttl')w=S.call?S.call.ttl/S.call.max*100:0;
    else{const p=pet(+id);if(!p)continue;
      if(k==='mood'){w=p.mood;el.style.background=p.mood>60?'var(--accent2)':p.mood>30?'var(--warn)':'var(--bad)'}
      else if(k==='stay')w=p.state==='pickup'?100:(1-p.stay/p.total)*100;
      else if(k==='act')w=p.act?(1-p.act.left/p.act.total)*100:0;
      else if(k==='meet')w=p.meetAct?(1-p.meetAct.left/p.meetAct.total)*100:100;}
    el.style.width=Math.max(0,Math.min(100,w)).toFixed(1)+'%';
  }
  for(const el of document.querySelectorAll('#app [data-x]')){
    const [k,id]=el.dataset.x.split(':');let t='';
    if(k==='money')t=fmt(S.money);else if(k==='rating')t=rating().toFixed(1);
    else if(k==='qexp'){const q=S.queue.find(x=>x.id===+id);if(!q)continue;const r=Math.max(0,Math.ceil(q.exp-S.t));t=r>=60?Math.floor(r/60)+' мин '+(r%60)+' с':r+' с'}
    else{const p=pet(+id);if(!p)continue;
      if(k==='eta')t=Math.max(1,Math.ceil(p.eta));
      else if(k==='mood')t=Math.round(p.mood)+'%';
      else if(k==='left')t=p.state==='pickup'?'сейчас':Math.max(0,Math.ceil(p.stay))+' с';}
    if(el.textContent!==String(t))el.textContent=t;
  }
}

// ---------- Листы: звонок, знакомство, магазин ----------
function callSheet(){
  const c=S.call;if(!c)return '';
  const g=c.pet,T=PET[g.type],can=freeSlots()>0;
  return `<div class="sh-title">📞 Звонок</div>
    <div class="bigpet">${T.svg}</div>
    <div class="bubble">Здравствуйте! Это хозяйка ${T.whose} по кличке <b>${g.name}</b>. Ему ${g.age} ${years(g.age)}, ${g.like}. Можно к вам на передержку? 🙏</div>
    <div class="choices"><button class="bigbtn green" data-act="yes" ${can?'':'disabled'}>${can?'Мы вас ждём!':'Свободных номеров нет'}</button>${!can&&S.staff.phone?`<button class="bigbtn green" data-act="queue" ${S.queue.length<QUEUE_MAX?'':'disabled'}>📋 В очередь${S.queue.length>=QUEUE_MAX?' (полная)':''}</button>`:''}<button class="bigbtn ghost" data-act="no">Нет мест</button></div>`;
}
function meetSheet(id){
  const p=pet(id);if(!p)return '';
  const T=PET[p.type];
  return `<div class="sh-title">🐾 Знакомство: ${p.name}</div>
    <div class="sh-sub">${T.kind}, ${p.age} ${years(p.age)} · ${p.like}</div>
    <div class="bigpet" id="bigpet">${T.svg}</div>
    <div class="react-txt">${p.meetAct?MEET[p.meetAct.k].name+'…':p.react||'Познакомьтесь с гостем 💛'}</div>
    <div class="acts3">${Object.entries(MEET).map(([k,m])=>{const doing=p.meetAct&&p.meetAct.k===k;
      return `<button class="${doing?'doing':p.did.includes(k)?'did':''}" data-act="meetdo" data-k="${p.id}:${k}">${m.icon}<small>${p.did.includes(k)?'✅ '+m.name:m.name}</small>${doing?`<i class="prog" data-w="meet:${p.id}"></i>`:''}</button>`}).join('')}</div>
    <div class="meet-mood">Настроение при заселении: <b>${meetMood(p)}%</b>${p.did.length<3?' · познакомьтесь, чтобы было выше':''}</div>
    <div class="sh-h">Пожелания</div>
    <div class="needs">${needsHTML(p)}</div>
    ${(()=>{const P=plan(p),T=TAR[P.tk];
      return `<button class="tarif" data-act="checkin" data-k="${p.id}"><span class="ic">${T.icon}</span><div><b>Заселить · ${P.list.map(k=>SVC[k].icon).join('')}</b><small>${T.name} · ~${P.stay} с</small></div><span class="pr">до ${Math.round(P.price*1.44)} 💰</span></button>`})()}`;
}
function needsHTML(p){
  if(p.meetAct&&p.meetAct.k==='check')return `<div class="hint">🩺 Идёт осмотр…</div>`;
  if(!p.did.includes('check'))return `<div class="hint">🩺 Осмотрите гостя, чтобы узнать, что ему нужно. Без осмотра — только еда, а хозяин может остаться недоволен.</div>`;
  const all=p.needs||[];
  const rows=[`<div class="nd"><span>🍖</span>Еда и лежанка — всегда</div>`,
    ...all.map(k=>svcOpen(k)?`<div class="nd"><span>${SVC[k].icon}</span>${NEED[k][p.type]} → ${svcName(k,p).toLowerCase()}</div>`
      :`<div class="nd off"><span>🔒</span>${NEED[k][p.type]} · нужно купить: ${EQ[SVC[k].eq].name.toLowerCase()}</div>`)];
  if(!all.length)rows.push(`<div class="hint">Здоров и доволен — больше ничего не нужно 👍</div>`);
  return rows.join('');
}
function row(ic,title,desc,what,k,c,done,doneText){
  const btn=done?`<button class="buy done" disabled>${doneText||'✅'}</button>`:`<button class="buy" data-act="buy" data-what="${what}" ${k!=null?`data-k="${k}"`:''} ${S.money>=c?'':'disabled'}>${fmt(c)} 💰</button>`;
  return `<div class="row"><span class="ic">${ic}</span><div><b>${title}</b><small>${desc}</small></div>${btn}</div>`;
}
function shopSheet(){
  const open=Object.keys(SVC).filter(svcOpen);
  return `<div class="sh-title">🛒 Магазин и прокачка</div><div class="sh-sub">Баланс: ${fmt(S.money)} 💰</div>
    <div class="sh-h">Оборудование</div>
    ${row('🛏️','Лежанка и миски','Есть с самого начала',null,null,0,true,'Есть ✅')}
    ${Object.entries(EQ).map(([k,e])=>row(e.icon,e.name,e.desc,'eq',k,e.cost,S.eq[k],'Есть ✅')).join('')}
    <div class="sh-h">Номера</div>
    ${row('🏨',`Новый номер · ${S.rooms}/${MAX_ROOMS}`,'Можно принять больше гостей','room',null,ROOM_COST[S.rooms]||0,S.rooms>=MAX_ROOMS,'МАКС')}
    <div class="sh-h">Скорость ухода</div>
    ${open.map(k=>row(SVC[k].icon,`${SVC[k].name} · ур. ${S.lvl[k]+1}`,`${svcTime(k).toFixed(1)} с → ${(svcTime(k)*0.85).toFixed(1)} с`,'lvl',k,lvlCost(k),S.lvl[k]>=MAX_LVL,'МАКС')).join('')}
    <div class="sh-h">Персонал</div>
    ${Object.entries(STAFF).map(([k,st])=>row(st.icon,st.name,st.desc,'staff',k,st.cost,S.staff[k],'Нанят ✅')).join('')}
    <div class="sh-h">Помощники по уходу</div>
    ${open.map(k=>row('🧑',`Помощник: ${SVC[k].name.toLowerCase()}`,'Сам делает это, если гость скучает без дела 4 с','help',k,HELP[k],S.help[k],'Нанят ✅')).join('')}
    <div class="stats"><div>Гостей обслужено<b>${S.served}</b></div><div>Заработано<b>${fmt(S.earned)} 💰</b></div><div>Отказов<b>${S.declined}</b></div><div>Пропущено звонков<b>${S.missed}</b></div></div>
    <button class="link" data-act="reset">Начать заново</button>
    <div class="sh-sub" style="margin-top:10px;text-align:center">Хвостатый отель · версия ${VERSION}</div>`;
}
function petInfoSheet(id){
  const p=pet(id);if(!p||!p.tariff)return '';
  const T=TAR[p.tariff];
  return `<div class="sh-title">${p.name} · ${T.icon} ${T.name}</div>
    <div class="sh-sub">${PET[p.type].kind}, ${p.age} ${years(p.age)} · ${p.like}</div>
    <div class="bigpet">${PET[p.type].svg}</div>
    ${p.reqs.map(r=>`<div class="row"><span class="ic">${SVC[r.svc].icon}</span><div><b>${svcName(r.svc,p)}</b><small>${r.done?'✅ сделано':r.miss?'❌ пропущено':onCd(p,r.svc)?'⏳ отдыхает':'можно делать'}</small></div></div>`).join('')}`;
}
function renderSheet(){
  if(!sheet)return;
  const h=sheet.type==='call'?callSheet():sheet.type==='meet'?meetSheet(sheet.k):sheet.type==='shop'?shopSheet():sheet.type==='petinfo'?petInfoSheet(sheet.k):'';
  if(h)$('sheetIn').innerHTML=h;else closeSheet();
}
function openSheet(s){sheet=s;$('back').style.display='block';$('sheet').style.display='flex';renderSheet()}
function closeSheet(){sheet=null;$('back').style.display='none';$('sheet').style.display='none'}

// ---------- Эффекты ----------
function floatAt(id,text,color,dy){
  const el=$(id);if(!el)return;
  const r=el.getBoundingClientRect();
  const d=document.createElement('div');d.className='fl';d.textContent=text;d.style.color=color;
  d.style.left=(r.left+r.width/2+rnd(-20,20))+'px';d.style.top=(r.top+r.height/2+(dy||0))+'px';
  $('fx').appendChild(d);setTimeout(()=>d.remove(),1100);
}
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)}
function toastOnce(key,m){if(S.tips[key])return;S.tips[key]=1;toast(m)}

// ---------- Ввод ----------
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,k=el.dataset.k;
  if(a==='call')openSheet({type:'call'});
  else if(a==='yes')answer(true);
  else if(a==='no')answer(false);
  else if(a==='queue')answer('queue');
  else if(a==='qtoggle'){qOpen=!qOpen;dirty=true}
  else if(a==='qcall')callBack(+k);
  else if(a==='meet')openSheet({type:'meet',k:+k});
  else if(a==='meetdo'){
    const [id,act]=k.split(':'),p=pet(+id);if(!p)return;
    if(p.did.includes(act))return;
    if(p.meetAct){floatAt('bigpet','Уже заняты 🙂','#8a7a70');return}
    startMeet(p,act);renderSheet();
  }
  else if(a==='checkin')checkIn(+k);
  else if(a==='svc'){const [id,s]=k.split(':');doService(+id,s)}
  else if(a==='pickup')pickup(+k);
  else if(a==='petinfo')openSheet({type:'petinfo',k:+k});
  else if(a==='shop')openSheet({type:'shop'});
  else if(a==='buy'){buy(el.dataset.what,k);renderSheet()}
  else if(a==='buyroom'){const c=ROOM_COST[S.rooms];if(S.money>=c)buy('room');else toast(`Новый номер стоит ${fmt(c)} 💰`)}
  else if(a==='close')closeSheet();
  else if(a==='reset'){if(confirm('Начать игру заново?')){S=fresh();save();closeSheet();dirty=true}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else last=performance.now()});
window.addEventListener('pagehide',()=>save());

// ---------- Цикл ----------
// Пока игра закрыта, время стоит: гости ждут вас, никто не грустит.
let last=performance.now(),saveAcc=0,sheetAcc=0;
function loop(now){
  const dt=Math.min(1,Math.max(0,(now-last)/1000));last=now;
  for(let r=dt;r>0;r-=0.1)tick(Math.min(0.1,r));
  const key=structKey();
  if(dirty||key!==lastKey){lastKey=key;dirty=false;render()}else update();
  sheetAcc+=dt;if(sheetAcc>0.5&&sheet&&(sheet.type==='shop'||sheet.type==='petinfo')){sheetAcc=0;renderSheet()}
  saveAcc+=dt;if(saveAcc>=3){saveAcc=0;save()}
  requestAnimationFrame(loop);
}
render();
toastOnce('start','👋 Добро пожаловать в «Хвостатый отель»! Ждём первого звонка…');
requestAnimationFrame(loop);
if('serviceWorker' in navigator){
  // как только встала новая версия — один раз перезагружаемся, чтобы игрок сразу её увидел
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;save();location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    r.update();
    // на телефоне игру обычно сворачивают, а не закрывают — проверяем обновление при каждом возвращении
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})});
  }).catch(()=>{});
}
</script>
</body>
</html>
